<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">요청 목록 화면 다이어그램</title>
  <desc id="desc">요청 번호 RQ-1042가 검토 대기 상태인 표와 확인해야 할 필드</desc>
  <rect width="960" height="540" fill="#f6f1e7"/>
  <rect x="52" y="44" width="856" height="452" rx="24" fill="#fffdf7" stroke="#d7cec0" stroke-width="2"/>
  <text x="88" y="104" fill="#16324f" font-family="sans-serif" font-size="30" font-weight="700">요청 목록</text>
  <rect x="88" y="144" width="784" height="62" rx="8" fill="#16324f"/>
  <text x="112" y="184" fill="#ffffff" font-family="sans-serif" font-size="20">요청 번호</text>
  <text x="330" y="184" fill="#ffffff" font-family="sans-serif" font-size="20">요청자</text>
  <text x="538" y="184" fill="#ffffff" font-family="sans-serif" font-size="20">현재 상태</text>
  <rect x="88" y="218" width="784" height="92" rx="8" fill="#edf7f6" stroke="#177e89" stroke-width="3"/>
  <text x="112" y="274" fill="#17212b" font-family="sans-serif" font-size="24" font-weight="700">RQ-1042</text>
  <text x="330" y="274" fill="#17212b" font-family="sans-serif" font-size="22">김운영</text>
  <rect x="538" y="240" width="170" height="48" rx="24" fill="#f8dfaf"/>
  <text x="570" y="272" fill="#5d3300" font-family="sans-serif" font-size="20" font-weight="700">검토 대기</text>
  <line x1="196" y1="330" x2="196" y2="394" stroke="#177e89" stroke-width="4"/>
  <line x1="196" y1="394" x2="512" y2="394" stroke="#177e89" stroke-width="4"/>
  <polygon points="512,394 492,382 492,406" fill="#177e89"/>
  <text x="88" y="446" fill="#5e6872" font-family="sans-serif" font-size="20">요청 번호와 상태가 상세 화면에서도 같은지 확인한다.</text>
</svg>
