interface:
  display_name: "한국어 책·매뉴얼 제작"
  short_description: "근거 기반 출판 PDF와 운영 매뉴얼 HTML을 제작·검수"
  brand_color: "#0A1A2A"
  default_prompt: "먼저 산출물 형식을 book, manual, hybrid 중에서 판정해. 책이면 원문 기반 출판 PDF를 만들고 전 페이지를 검수해. 운영 매뉴얼이면 실제 업무 흐름, 초보자 개요, 독립 lesson, 화면·문서 근거, 위험 경계를 manual.yaml로 정리한 뒤 정적 HTML 패키지를 빌드하고 technical/content/visual 검증을 분리해. 참고자료 내용과 확인하지 않은 동작은 합치거나 발명하지 마."
policy:
  allow_implicit_invocation: true
