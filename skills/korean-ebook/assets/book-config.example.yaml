book:
  # "auto"이면 README.md 또는 첫 번째 원고의 H1을 사용합니다.
  title: "auto"
  # 비워 두면 title을 PDF 메타데이터 제목으로 사용합니다.
  metadata_title: ""
  subtitle: ""
  author: ""
  language: "ko-KR"
  short_title: "EDITORIAL BOOK"
  output_name: "편집본"
  subject: "auto"
  keywords: []
  edition_label: "한국어 PDF 편집본"
  copyright_notice: "원고의 저작권·배포 조건은 원문을 따릅니다."
  build_date: "auto"

files:
  include:
    - "*.md"
    - "**/*.md"
  exclude:
    - "**/node_modules/**"
    - "**/.git/**"
    - "**/output/**"
    - "**/*_완료보고서.md"
  front_matter_file: "README.md"
  order: []
  strip_front_matter_sections:
    - "목차"
  # 저장소용 안내처럼 책 본문에서 제외하거나 다른 편집면으로 옮길
  # 문단만 정확히 지정합니다. 기본값은 제거 없음입니다.
  front_matter_drop_paragraphs: []
  # 앞 문단을 옮긴 뒤 맨 앞에 남은 Markdown 수평선을 지울지 결정합니다.
  strip_front_matter_leading_rules: false
  chapter_file_pattern: "^[0-9]{2}[-_].*\\.md$"

editorial:
  preset: "fde-midnight"
  include_cover: true
  include_title_page: true
  include_editorial_note: true
  include_generated_toc: true
  include_chapter_openers: true
  toc_depth: 2
  section_list_depth: 2
  cover_eyebrow: "EDITORIAL EDITION"
  cover_watermark: ""
  title_page_quote: "auto"
  title_page_edition_label: ""
  front_matter_header: ""
  chapter_eyebrow: "CHAPTER"
  appendix_eyebrow: "APPENDIX"
  afterword_eyebrow: "AFTERWORD"
  editorial_note_title: "PDF 편집본 안내"
  editorial_note_paragraphs:
    - "이 문서는 제공된 원고를 하나의 책으로 편집한 PDF입니다. 원문의 장·절 구조와 본문 내용을 유지했습니다."
    - "표지, 목차, 장 표제지, 머리말·꼬리말, 링크와 인용문 스타일은 읽기와 탐색을 돕도록 재구성했습니다. 원고의 사실관계와 출처 표기는 원문을 따릅니다."
  editorial_note_footer_paragraphs: []
  build_date_format: "iso"
  cover_process_chips: []

visuals:
  # true로 바꾸면 장 표제지 다음에 원문 기반 시각 요약 페이지를 넣습니다.
  enabled: false
  # true이면 각 장의 H2 제목을 최대 6개까지 process 카드로 자동 구성합니다.
  # 자동 결과도 반드시 원문과 대조해 검수해야 합니다.
  auto_from_headings: false
  default_kicker: "VISUAL GUIDE"
  default_note: "편집 요약: 본문의 장·절 구조와 핵심 문장을 재배열한 도식이며, 원문을 대체하지 않습니다."
  chapters: {}

summary:
  # true로 바꾸면 PDF 빌드 후 원문 기반 요약본(용어집 + 장별 요약) 스캐폴드를 생성합니다.
  # 스캐폴드는 비어 있으며, 에이전트가 핵심 아이디어·개념·요약을 원문 근거에 입각해 채웁니다.
  # PDF 본문과는 별개의 참조 레이어이며 원문을 대체하지 않습니다.
  enabled: false
  # true이면 각 장의 H2 제목과 본문 **굵은 용어**를 용어집 후보로 자동 추출합니다.
  # 자동 후보도 반드시 원문과 대조해 에이전트가 선별해야 합니다.
  auto_terms: true
  default_note: "편집 요약: 본문 핵심을 탐색 쉽게 재구성한 참조 레이어이며 원문을 대체하지 않는다."

style:
  page_size: "A4"
  body_font: "NanumMyeongjo, Noto Serif CJK KR, serif"
  heading_font: "NanumSquare, Noto Sans CJK KR, sans-serif"
  mono_font: "NanumGothicCoding, Noto Sans Mono CJK KR, monospace"
  body_font_size_pt: 10.6
  body_line_height: 1.82
  colors:
    navy: "#081827"
    navy_alt: "#102B38"
    cyan: "#36C7D0"
    cyan_dark: "#0F8790"
    amber: "#D39A2C"
    ink: "#142131"
    text: "#283541"
    muted: "#7A8791"
    line: "#D8E1E2"
    wash: "#EFF5F4"
    paper: "#FFFFFF"
  margins_mm:
    top: 20
    right: 22
    bottom: 19
    left: 22
  # 특정 장의 밀도 보정처럼 프로젝트별 CSS가 꼭 필요할 때만 사용합니다.
  extra_css: ""

quality:
  require_a4: true
  require_embedded_fonts: true
  require_unicode_fonts: true
  require_outline: true
  allow_blank_pages: 0
  paragraph_probe_min_chars: 36
  paragraph_probe_limit: 1200
  reference_ngram_words: 8
  reference_ngram_min_chars: 44
