schema_version: 1
checked: 2026-08-12
policy:
  evidence_grades:
    A: 공개 데이터, 표준, 원 논문 또는 정부 기술 문서
    B: 당사자 공식 제품 문서, 사용자 가이드 또는 공식 발표
    C: A·B 근거를 사용한 저자 계산
    D: 기존 KLIC 책에서 발견한 조사 질문이며 본문 사실 근거로 사용하지 않음
  direct_quotes: 원칙적으로 사용하지 않으며 제품명과 표준 명칭만 원문 표기를 유지한다.
