<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="FIG-002-title FIG-002-desc">
  <title id="FIG-002-title">워크로드 요구사항에서 시설 결정까지</title>
  <desc id="FIG-002-desc">워크로드 목적, 완료 조건, 데이터 경계, 용량 가정, 시설 준비도를 순서대로 연결한 요구사항 흐름도.</desc>
  <defs>
    <style>.paper { fill: #f7f5ef; }
.band { fill: #10324a; }
.surface { fill: #dce8e8; stroke: #10324a; stroke-width: 3; }
.surface-teal { fill: #d7eceb; stroke: #087e8b; stroke-width: 3; }
.surface-amber { fill: #f4e5c9; stroke: #d18b24; stroke-width: 3; }
.line { stroke: #7f9ba0; stroke-width: 4; fill: none; marker-end: url(#arrow); }
.rule { stroke: #7f9ba0; stroke-width: 2; }
.title { font-family: 'Noto Serif CJK KR', serif; font-size: 38px; font-weight: 700; fill: #f7f5ef; }
.subtitle { font-family: 'Noto Sans CJK KR', sans-serif; font-size: 22px; fill: #18313f; }
.body { font-family: 'Noto Sans CJK KR', sans-serif; font-size: 21px; fill: #18313f; }
.small { font-family: 'Noto Sans CJK KR', sans-serif; font-size: 17px; fill: #18313f; }
.value { font-family: 'Noto Sans CJK KR', sans-serif; font-size: 24px; font-weight: 700; fill: #10324a; }
.node-label { font-family: 'Noto Sans CJK KR', sans-serif; font-size: 21px; font-weight: 700; fill: #18313f; }
.bar-teal { fill: #087e8b; }
.bar-navy { fill: #10324a; }
.bar-amber { fill: #d18b24; }</style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><polygon points="0,0 12,6 0,12" fill="#7f9ba0"/></marker>
  </defs>
  <rect class="paper" width="1600" height="900"/>
  <rect class="band" width="1600" height="112"/>
  <text x="90.0" y="68.0" class="title" text-anchor="start"><tspan x="90.0" dy="0">워크로드 요구사항에서 시설 결정까지</tspan></text>
  <text x="90.0" y="154.0" class="subtitle" text-anchor="start"><tspan x="90.0" dy="0">업무 목표·SLO·데이터 경계가 용량과 시설 질문으로 이어진다.</tspan></text>
  <line class="rule" x1="90" y1="182" x2="1510" y2="182"/>
  <line class="line" x1="335.0" y1="345.0" x2="385.0" y2="345.0"/>
  <line class="line" x1="630.0" y1="345.0" x2="680.0" y2="345.0"/>
  <line class="line" x1="925.0" y1="345.0" x2="975.0" y2="345.0"/>
  <line class="line" x1="1000.4" y1="405.0" x2="782.1" y2="540.0"/>
  <rect class="surface" x="90.0" y="285.0" width="245.0" height="120.0" rx="14"/>
  <text x="212.5" y="330.0" class="node-label" text-anchor="middle"><tspan x="212.5" dy="0">업무 목적</tspan><tspan x="212.5" dy="30">학습·추론·분석</tspan></text>
  <rect class="surface-teal" x="385.0" y="285.0" width="245.0" height="120.0" rx="14"/>
  <text x="507.5" y="330.0" class="node-label" text-anchor="middle"><tspan x="507.5" dy="0">완료 조건</tspan><tspan x="507.5" dy="30">지연·처리량·기한</tspan></text>
  <rect class="surface-amber" x="680.0" y="285.0" width="245.0" height="120.0" rx="14"/>
  <text x="802.5" y="330.0" class="node-label" text-anchor="middle"><tspan x="802.5" dy="0">데이터 경계</tspan><tspan x="802.5" dy="30">규제·보존·반출</tspan></text>
  <rect class="surface" x="975.0" y="285.0" width="245.0" height="120.0" rx="14"/>
  <text x="1097.5" y="330.0" class="node-label" text-anchor="middle"><tspan x="1097.5" dy="0">용량 가정</tspan><tspan x="1097.5" dy="30">피크·대기·회수</tspan></text>
  <rect class="surface-teal" x="535.0" y="540.0" width="300.0" height="120.0" rx="14"/>
  <text x="685.0" y="585.0" class="node-label" text-anchor="middle"><tspan x="685.0" dy="0">시설 준비도</tspan><tspan x="685.0" dy="30">전력·열·네트워크</tspan></text>
  <line class="rule" x1="90" y1="790" x2="1510" y2="790"/>
  <text x="90.0" y="830.0" class="small" text-anchor="start"><tspan x="90.0" dy="0">근거: 원자료 | SRC-006 · SRC-019</tspan></text>
  <text x="90.0" y="862.0" class="small" text-anchor="start"><tspan x="90.0" dy="0">FIG-002 | 워크로드 목적, 완료 조건, 데이터 경계, 용량 가정, 시설 준비도를 순서대로 연결한 요구사항 흐름도.</tspan></text>
