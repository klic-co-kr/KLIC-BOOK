  <text x="90.0" y="862.0" class="small" text-anchor="start"><tspan x="90.0" dy="0">FIG-008 | 개발, 학습, 평가, 등록, 배포, 관측, 롤백 단계를 순환시키고 운영 증거를 연결한 수명주기 도식.</tspan></text>
