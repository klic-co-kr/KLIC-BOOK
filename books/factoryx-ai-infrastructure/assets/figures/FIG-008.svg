  <rect class="surface-teal" x="370.0" y="285.0" width="220.0" height="110.0" rx="14"/>
  <text x="480.0" y="325.0" class="node-label" text-anchor="middle"><tspan x="480.0" dy="0">학습</tspan><tspan x="480.0" dy="30">실험·아티팩트</tspan></text>
