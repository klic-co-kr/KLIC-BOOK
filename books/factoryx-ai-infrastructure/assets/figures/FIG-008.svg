  <text x="1320.0" y="325.0" class="node-label" text-anchor="middle"><tspan x="1320.0" dy="0">배포</tspan><tspan x="1320.0" dy="30">엔드포인트·구성</tspan></text>
  <rect class="surface-amber" x="650.0" y="540.0" width="220.0" height="110.0" rx="14"/>
  <text x="760.0" y="580.0" class="node-label" text-anchor="middle"><tspan x="760.0" dy="0">관측·롤백</tspan><tspan x="760.0" dy="30">이전 승인 버전</tspan></text>
  <line class="rule" x1="90" y1="790" x2="1510" y2="790"/>
