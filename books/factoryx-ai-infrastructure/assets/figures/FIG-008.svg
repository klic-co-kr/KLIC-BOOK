  <text x="760.0" y="325.0" class="node-label" text-anchor="middle"><tspan x="760.0" dy="0">평가</tspan><tspan x="760.0" dy="30">임계값·결과</tspan></text>
  <rect class="surface" x="930.0" y="285.0" width="220.0" height="110.0" rx="14"/>
  <text x="1040.0" y="325.0" class="node-label" text-anchor="middle"><tspan x="1040.0" dy="0">등록</tspan><tspan x="1040.0" dy="30">불변 식별자</tspan></text>
