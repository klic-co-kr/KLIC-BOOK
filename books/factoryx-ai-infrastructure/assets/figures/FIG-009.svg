<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="FIG-009-title FIG-009-desc">
  <title id="FIG-009-title">관측 신호에서 운영 결정까지</title>
  <desc id="FIG-009-desc">시설, 클러스터, 제어면, 모델, 업무 신호 계층과 탐지, 범위 확인, 완화, 사후 검토를 연결한 관측 도식.</desc>
  <defs>
    <style>.paper { fill: #f7f5ef; }
.band { fill: #10324a; }
.surface { fill: #dce8e8; stroke: #10324a; stroke-width: 3; }
.surface-teal { fill: #d7eceb; stroke: #087e8b; stroke-width: 3; }
.surface-amber { fill: #f4e5c9; stroke: #d18b24; stroke-width: 3; }
.line { stroke: #7f9ba0; stroke-width: 4; fill: none; marker-end: url(#arrow); }
.rule { stroke: #7f9ba0; stroke-width: 2; }
.title { font-family: 'Noto Serif CJK KR', serif; font-size: 38px; font-weight: 700; fill: #f7f5ef; }
.subtitle { font-family: 'Noto Sans CJK KR', sans-serif; font-size: 22px; fill: #18313f; }
.body { font-family: 'Noto Sans CJK KR', sans-serif; font-size: 21px; fill: #18313f; }
.small { font-family: 'Noto Sans CJK KR', sans-serif; font-size: 17px; fill: #18313f; }
.value { font-family: 'Noto Sans CJK KR', sans-serif; font-size: 24px; font-weight: 700; fill: #10324a; }
.node-label { font-family: 'Noto Sans CJK KR', sans-serif; font-size: 21px; font-weight: 700; fill: #18313f; }
.bar-teal { fill: #087e8b; }
.bar-navy { fill: #10324a; }
.bar-amber { fill: #d18b24; }</style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><polygon points="0,0 12,6 0,12" fill="#7f9ba0"/></marker>
  </defs>
  <rect class="paper" width="1600" height="900"/>
  <rect class="band" width="1600" height="112"/>
  <text x="90.0" y="68.0" class="title" text-anchor="start"><tspan x="90.0" dy="0">관측 신호에서 운영 결정까지</tspan></text>
  <text x="90.0" y="154.0" class="subtitle" text-anchor="start"><tspan x="90.0" dy="0">시설·클러스터·제어면·모델·업무 신호를 사건 대응 루프에 연결한다.</tspan></text>
  <line class="rule" x1="90" y1="182" x2="1510" y2="182"/>
  <line class="line" x1="330.0" y1="330.0" x2="380.0" y2="330.0"/>
  <line class="line" x1="615.0" y1="330.0" x2="665.0" y2="330.0"/>
  <line class="line" x1="900.0" y1="330.0" x2="950.0" y2="330.0"/>
  <line class="line" x1="1185.0" y1="330.0" x2="1235.0" y2="330.0"/>
  <line class="line" x1="786.0" y1="385.0" x2="796.2" y2="545.0"/>
  <rect class="surface" x="95.0" y="275.0" width="235.0" height="110.0" rx="14"/>
  <text x="212.5" y="315.0" class="node-label" text-anchor="middle"><tspan x="212.5" dy="0">시설 신호</tspan><tspan x="212.5" dy="30">전력·열·냉각</tspan></text>
  <rect class="surface-teal" x="380.0" y="275.0" width="235.0" height="110.0" rx="14"/>
  <text x="497.5" y="315.0" class="node-label" text-anchor="middle"><tspan x="497.5" dy="0">클러스터 신호</tspan><tspan x="497.5" dy="30">GPU·패브릭·큐</tspan></text>
  <rect class="surface-amber" x="665.0" y="275.0" width="235.0" height="110.0" rx="14"/>
  <text x="782.5" y="315.0" class="node-label" text-anchor="middle"><tspan x="782.5" dy="0">제어면 신호</tspan><tspan x="782.5" dy="30">할당·정책</tspan></text>
  <rect class="surface" x="950.0" y="275.0" width="235.0" height="110.0" rx="14"/>
  <text x="1067.5" y="315.0" class="node-label" text-anchor="middle"><tspan x="1067.5" dy="0">모델 신호</tspan><tspan x="1067.5" dy="30">지연·오류·품질</tspan></text>
  <rect class="surface-teal" x="1235.0" y="275.0" width="235.0" height="110.0" rx="14"/>
  <text x="1352.5" y="315.0" class="node-label" text-anchor="middle"><tspan x="1352.5" dy="0">업무 신호</tspan><tspan x="1352.5" dy="30">영향·승인</tspan></text>
  <rect class="surface-amber" x="480.0" y="545.0" width="640.0" height="120.0" rx="14"/>
  <text x="800.0" y="605.0" class="node-label" text-anchor="middle"><tspan x="800.0" dy="0">탐지 → 범위 확인 → 완화 → 사후 검토</tspan></text>
  <line class="rule" x1="90" y1="790" x2="1510" y2="790"/>
  <text x="90.0" y="830.0" class="small" text-anchor="start"><tspan x="90.0" dy="0">근거: 원자료 | SRC-019 · SRC-021 · SRC-028 · SRC-029 · SRC-033</tspan></text>
  <text x="90.0" y="862.0" class="small" text-anchor="start"><tspan x="90.0" dy="0">FIG-009 | 시설, 클러스터, 제어면, 모델, 업무 신호 계층과 탐지, 범위 확인, 완화, 사후 검토를 연결한 관측 도식.</tspan></text>
</svg>
