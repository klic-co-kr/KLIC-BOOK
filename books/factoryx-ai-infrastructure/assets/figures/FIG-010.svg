<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="FIG-010-title FIG-010-desc">
  <title id="FIG-010-title">프라이빗 AI의 네 가지 독립 경계</title>
  <desc id="FIG-010-desc">사용자와 승인 데이터, 모델과 도구 공급망, 권한 정책, 감사 기록의 네 경계를 정책 평가 루프와 연결한 보안 도식.</desc>
  <defs>
    <style>.paper { fill: #f7f5ef; }
.band { fill: #10324a; }
.surface { fill: #dce8e8; stroke: #10324a; stroke-width: 3; }
.surface-teal { fill: #d7eceb; stroke: #087e8b; stroke-width: 3; }
.surface-amber { fill: #f4e5c9; stroke: #d18b24; stroke-width: 3; }
.line { stroke: #7f9ba0; stroke-width: 4; fill: none; marker-end: url(#arrow); }
.rule { stroke: #7f9ba0; stroke-width: 2; }
.title { font-family: 'Noto Serif CJK KR', serif; font-size: 38px; font-weight: 700; fill: #f7f5ef; }
.subtitle { font-family: 'Noto Sans CJK KR', sans-serif; font-size: 22px; fill: #18313f; }
.body { font-family: 'Noto Sans CJK KR', sans-serif; font-size: 21px; fill: #18313f; }
.small { font-family: 'Noto Sans CJK KR', sans-serif; font-size: 17px; fill: #18313f; }
.value { font-family: 'Noto Sans CJK KR', sans-serif; font-size: 24px; font-weight: 700; fill: #10324a; }
.node-label { font-family: 'Noto Sans CJK KR', sans-serif; font-size: 21px; font-weight: 700; fill: #18313f; }
.bar-teal { fill: #087e8b; }
.bar-navy { fill: #10324a; }
.bar-amber { fill: #d18b24; }</style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><polygon points="0,0 12,6 0,12" fill="#7f9ba0"/></marker>
  </defs>
  <rect class="paper" width="1600" height="900"/>
  <rect class="band" width="1600" height="112"/>
  <text x="90.0" y="68.0" class="title" text-anchor="start"><tspan x="90.0" dy="0">프라이빗 AI의 네 가지 독립 경계</tspan></text>
  <text x="90.0" y="154.0" class="subtitle" text-anchor="start"><tspan x="90.0" dy="0">데이터·도구·권한·감사를 정책과 평가가 가로지르게 설계한다.</tspan></text>
  <line class="rule" x1="90" y1="182" x2="1510" y2="182"/>
  <line class="line" x1="400.0" y1="345.0" x2="470.0" y2="345.0"/>
  <line class="line" x1="740.0" y1="345.0" x2="810.0" y2="345.0"/>
  <line class="line" x1="1080.0" y1="345.0" x2="1150.0" y2="345.0"/>
  <line class="line" x1="907.6" y1="405.0" x2="817.4" y2="550.0"/>
  <rect class="surface" x="130.0" y="285.0" width="270.0" height="120.0" rx="14"/>
  <text x="265.0" y="330.0" class="node-label" text-anchor="middle"><tspan x="265.0" dy="0">데이터 경계</tspan><tspan x="265.0" dy="30">승인·보존·반출</tspan></text>
  <rect class="surface-teal" x="470.0" y="285.0" width="270.0" height="120.0" rx="14"/>
  <text x="605.0" y="330.0" class="node-label" text-anchor="middle"><tspan x="605.0" dy="0">도구 공급망</tspan><tspan x="605.0" dy="30">모델·검색·연동</tspan></text>
  <rect class="surface-amber" x="810.0" y="285.0" width="270.0" height="120.0" rx="14"/>
  <text x="945.0" y="330.0" class="node-label" text-anchor="middle"><tspan x="945.0" dy="0">권한 경계</tspan><tspan x="945.0" dy="30">최소 권한·승인</tspan></text>
  <rect class="surface" x="1150.0" y="285.0" width="270.0" height="120.0" rx="14"/>
  <text x="1285.0" y="330.0" class="node-label" text-anchor="middle"><tspan x="1285.0" dy="0">감사 경계</tspan><tspan x="1285.0" dy="30">추적·검토</tspan></text>
  <rect class="surface-teal" x="540.0" y="550.0" width="480.0" height="120.0" rx="14"/>
  <text x="780.0" y="595.0" class="node-label" text-anchor="middle"><tspan x="780.0" dy="0">정책·평가 루프</tspan><tspan x="780.0" dy="30">위험 식별과 개선</tspan></text>
  <line class="rule" x1="90" y1="790" x2="1510" y2="790"/>
  <text x="90.0" y="830.0" class="small" text-anchor="start"><tspan x="90.0" dy="0">근거: 원자료 | SRC-030 · SRC-031 · SRC-032</tspan></text>
  <text x="90.0" y="862.0" class="small" text-anchor="start"><tspan x="90.0" dy="0">FIG-010 | 사용자와 승인 데이터, 모델과 도구 공급망, 권한 정책, 감사 기록의 네 경계를 정책 평가 루프와 연결한 보안 도식.</tspan></text>
</svg>
