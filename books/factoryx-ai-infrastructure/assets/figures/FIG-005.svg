<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="FIG-005-title FIG-005-desc">
  <title id="FIG-005-title">GPU·패브릭·스토리지 데이터 경로</title>
  <desc id="FIG-005-desc">GPU 노드, NDR 패브릭, 집단 통신, 병렬 스토리지, 관리 경로가 연결된 일반 참조 데이터 경로 도식.</desc>
  <defs>
    <style>.paper { fill: #f7f5ef; }
.band { fill: #10324a; }
.surface { fill: #dce8e8; stroke: #10324a; stroke-width: 3; }
.surface-teal { fill: #d7eceb; stroke: #087e8b; stroke-width: 3; }
.surface-amber { fill: #f4e5c9; stroke: #d18b24; stroke-width: 3; }
.line { stroke: #7f9ba0; stroke-width: 4; fill: none; marker-end: url(#arrow); }
.rule { stroke: #7f9ba0; stroke-width: 2; }
.title { font-family: 'Noto Serif CJK KR', serif; font-size: 38px; font-weight: 700; fill: #f7f5ef; }
.subtitle { font-family: 'Noto Sans CJK KR', sans-serif; font-size: 22px; fill: #18313f; }
.body { font-family: 'Noto Sans CJK KR', sans-serif; font-size: 21px; fill: #18313f; }
.small { font-family: 'Noto Sans CJK KR', sans-serif; font-size: 17px; fill: #18313f; }
.value { font-family: 'Noto Sans CJK KR', sans-serif; font-size: 24px; font-weight: 700; fill: #10324a; }
.node-label { font-family: 'Noto Sans CJK KR', sans-serif; font-size: 21px; font-weight: 700; fill: #18313f; }
.bar-teal { fill: #087e8b; }
.bar-navy { fill: #10324a; }
.bar-amber { fill: #d18b24; }</style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><polygon points="0,0 12,6 0,12" fill="#7f9ba0"/></marker>
  </defs>
  <rect class="paper" width="1600" height="900"/>
  <rect class="band" width="1600" height="112"/>
  <text x="90.0" y="68.0" class="title" text-anchor="start"><tspan x="90.0" dy="0">GPU·패브릭·스토리지 데이터 경로</tspan></text>
  <text x="90.0" y="154.0" class="subtitle" text-anchor="start"><tspan x="90.0" dy="0">노드 내부 통신, 패브릭 집단 통신, 스토리지 경로의 책임을 분리한다.</tspan></text>
  <line class="rule" x1="90" y1="182" x2="1510" y2="182"/>
  <line class="line" x1="350.0" y1="370.0" x2="445.0" y2="370.0"/>
  <line class="line" x1="715.0" y1="370.0" x2="810.0" y2="370.0"/>
  <line class="line" x1="1060.0" y1="370.0" x2="1155.0" y2="370.0"/>
  <line class="line" x1="614.3" y1="430.0" x2="685.7" y2="555.0"/>
  <rect class="surface" x="100.0" y="310.0" width="250.0" height="120.0" rx="14"/>
  <text x="225.0" y="355.0" class="node-label" text-anchor="middle"><tspan x="225.0" dy="0">GPU 노드</tspan><tspan x="225.0" dy="30">계산·메모리</tspan></text>
  <rect class="surface-teal" x="445.0" y="310.0" width="270.0" height="120.0" rx="14"/>
  <text x="580.0" y="355.0" class="node-label" text-anchor="middle"><tspan x="580.0" dy="0">NDR 패브릭</tspan><tspan x="580.0" dy="30">방향당 400 Gbps</tspan></text>
  <rect class="surface-amber" x="810.0" y="310.0" width="250.0" height="120.0" rx="14"/>
  <text x="935.0" y="355.0" class="node-label" text-anchor="middle"><tspan x="935.0" dy="0">집단 통신</tspan><tspan x="935.0" dy="30">NCCL·MPI 역할</tspan></text>
  <rect class="surface" x="1155.0" y="310.0" width="250.0" height="120.0" rx="14"/>
  <text x="1280.0" y="355.0" class="node-label" text-anchor="middle"><tspan x="1280.0" dy="0">병렬 스토리지</tspan><tspan x="1280.0" dy="30">입출력 경로</tspan></text>
  <rect class="surface-teal" x="485.0" y="555.0" width="470.0" height="120.0" rx="14"/>
  <text x="720.0" y="600.0" class="node-label" text-anchor="middle"><tspan x="720.0" dy="0">32 시스템 SU는 일반 참조</tspan><tspan x="720.0" dy="30">FactoryX 토폴로지 단정 금지</tspan></text>
  <line class="rule" x1="90" y1="790" x2="1510" y2="790"/>
  <text x="90.0" y="830.0" class="small" text-anchor="start"><tspan x="90.0" dy="0">근거: 원자료 | SRC-011 · SRC-013 · SRC-015 · SRC-016 · SRC-017 · SRC-018</tspan></text>
  <text x="90.0" y="862.0" class="small" text-anchor="start"><tspan x="90.0" dy="0">FIG-005 | GPU 노드, NDR 패브릭, 집단 통신, 병렬 스토리지, 관리 경로가 연결된 일반 참조 데이터 경로 도식.</tspan></text>
</svg>
