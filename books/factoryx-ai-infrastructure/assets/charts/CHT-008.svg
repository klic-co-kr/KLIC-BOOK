<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="CHT-008-title CHT-008-desc">
  <title id="CHT-008-title">8-GPU 노드 단편화 설명용 가정</title>
  <desc id="CHT-008-desc">8-GPU 노드와 1, 2, 3, 4 GPU 요청을 순서대로 표시한 단편화 설명용 가정 계산 차트.</desc>
  <defs>
    <style>.paper { fill: #f7f5ef; }
.band { fill: #10324a; }
.surface { fill: #dce8e8; stroke: #10324a; stroke-width: 3; }
.surface-teal { fill: #d7eceb; stroke: #087e8b; stroke-width: 3; }
.surface-amber { fill: #f4e5c9; stroke: #d18b24; stroke-width: 3; }
.line { stroke: #7f9ba0; stroke-width: 4; fill: none; marker-end: url(#arrow); }
.rule { stroke: #7f9ba0; stroke-width: 2; }
.title { font-family: 'Noto Serif CJK KR', serif; font-size: 38px; font-weight: 700; fill: #f7f5ef; }
.subtitle { font-family: 'Noto Sans CJK KR', sans-serif; font-size: 22px; fill: #18313f; }
.body { font-family: 'Noto Sans CJK KR', sans-serif; font-size: 21px; fill: #18313f; }
.small { font-family: 'Noto Sans CJK KR', sans-serif; font-size: 17px; fill: #18313f; }
.value { font-family: 'Noto Sans CJK KR', sans-serif; font-size: 24px; font-weight: 700; fill: #10324a; }
.node-label { font-family: 'Noto Sans CJK KR', sans-serif; font-size: 21px; font-weight: 700; fill: #18313f; }
.bar-teal { fill: #087e8b; }
.bar-navy { fill: #10324a; }
.bar-amber { fill: #d18b24; }</style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><polygon points="0,0 12,6 0,12" fill="#7f9ba0"/></marker>
  </defs>
  <rect class="paper" width="1600" height="900"/>
  <rect class="band" width="1600" height="112"/>
  <text x="90.0" y="68.0" class="title" text-anchor="start"><tspan x="90.0" dy="0">8-GPU 노드 단편화 설명용 가정</tspan></text>
  <text x="90.0" y="154.0" class="subtitle" text-anchor="start"><tspan x="90.0" dy="0">순차 요청의 배치와 회수 순서가 연속 GPU 할당 가능성을 바꾸는 가정 계산이다.</tspan></text>
  <line class="rule" x1="90" y1="182" x2="1510" y2="182"/>
  <line class="rule" x1="140.0" y1="675.0" x2="1500.0" y2="675.0"/>
  <text x="140.0" y="255.0" class="body" text-anchor="start"><tspan x="140.0" dy="0">단위: GPU</tspan></text>
  <rect data-panel="explicit-toy-scenario" class="bar-teal" x="199.8" y="300.0" width="152.3" height="375.0" rx="8"/>
  <text x="276.0" y="284.0" class="value" text-anchor="middle"><tspan x="276.0" dy="0">8</tspan></text>
  <text x="276.0" y="714.0" class="small" text-anchor="middle"><tspan x="276.0" dy="0">노드</tspan><tspan x="276.0" dy="30">총 GPU</tspan></text>
  <rect data-panel="explicit-toy-scenario" class="bar-navy" x="471.8" y="628.1" width="152.3" height="46.9" rx="8"/>
  <text x="548.0" y="612.1" class="value" text-anchor="middle"><tspan x="548.0" dy="0">1</tspan></text>
  <text x="548.0" y="714.0" class="small" text-anchor="middle"><tspan x="548.0" dy="0">요청 A</tspan><tspan x="548.0" dy="30">GPU</tspan></text>
  <rect data-panel="explicit-toy-scenario" class="bar-amber" x="743.8" y="581.2" width="152.3" height="93.8" rx="8"/>
  <text x="820.0" y="565.2" class="value" text-anchor="middle"><tspan x="820.0" dy="0">2</tspan></text>
  <text x="820.0" y="714.0" class="small" text-anchor="middle"><tspan x="820.0" dy="0">요청 B</tspan><tspan x="820.0" dy="30">GPU</tspan></text>
  <rect data-panel="explicit-toy-scenario" class="bar-teal" x="1015.8" y="534.4" width="152.3" height="140.6" rx="8"/>
  <text x="1092.0" y="518.4" class="value" text-anchor="middle"><tspan x="1092.0" dy="0">3</tspan></text>
  <text x="1092.0" y="714.0" class="small" text-anchor="middle"><tspan x="1092.0" dy="0">요청 C</tspan><tspan x="1092.0" dy="30">GPU</tspan></text>
  <rect data-panel="explicit-toy-scenario" class="bar-navy" x="1287.8" y="487.5" width="152.3" height="187.5" rx="8"/>
  <text x="1364.0" y="471.5" class="value" text-anchor="middle"><tspan x="1364.0" dy="0">4</tspan></text>
  <text x="1364.0" y="714.0" class="small" text-anchor="middle"><tspan x="1364.0" dy="0">대기 요청</tspan><tspan x="1364.0" dy="30">GPU</tspan></text>
  <line class="rule" x1="90" y1="770" x2="1510" y2="770"/>
  <text x="90.0" y="812.0" class="small" text-anchor="start"><tspan x="90.0" dy="0">증거 표시: 가정 계산</tspan></text>
  <text x="90.0" y="844.0" class="small" text-anchor="start"><tspan x="90.0" dy="0">근거: 가정 계산 | 출처 없음</tspan></text>
  <text x="90.0" y="876.0" class="small" text-anchor="start"><tspan x="90.0" dy="0">CHT-008 | 8-GPU 노드와 1, 2, 3, 4 GPU 요청을 순서대로 표시한 단편화 설명용 가정 계산 차트.</tspan></text>
</svg>
