<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="CHT-004-title CHT-004-desc">
  <title id="CHT-004-title">수랭식 관련 발표의 별도 정규화 지수</title>
  <desc id="CHT-004-desc">공랭식 기준 100과 수랭식 장애율 약 33.3, 무고장 시간 260을 별도 지수로 보인 차트.</desc>
  <defs>
    <style>.paper { fill: #f7f5ef; }
.band { fill: #10324a; }
.surface { fill: #dce8e8; stroke: #10324a; stroke-width: 3; }
.surface-teal { fill: #d7eceb; stroke: #087e8b; stroke-width: 3; }
.surface-amber { fill: #f4e5c9; stroke: #d18b24; stroke-width: 3; }
.line { stroke: #7f9ba0; stroke-width: 4; fill: none; marker-end: url(#arrow); }
.rule { stroke: #7f9ba0; stroke-width: 2; }
.title { font-family: 'Noto Serif CJK KR', serif; font-size: 38px; font-weight: 700; fill: #f7f5ef; }
.subtitle { font-family: 'Noto Sans CJK KR', sans-serif; font-size: 22px; fill: #18313f; }
.body { font-family: 'Noto Sans CJK KR', sans-serif; font-size: 21px; fill: #18313f; }
.small { font-family: 'Noto Sans CJK KR', sans-serif; font-size: 17px; fill: #18313f; }
.value { font-family: 'Noto Sans CJK KR', sans-serif; font-size: 24px; font-weight: 700; fill: #10324a; }
.node-label { font-family: 'Noto Sans CJK KR', sans-serif; font-size: 21px; font-weight: 700; fill: #18313f; }
.bar-teal { fill: #087e8b; }
.bar-navy { fill: #10324a; }
.bar-amber { fill: #d18b24; }</style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><polygon points="0,0 12,6 0,12" fill="#7f9ba0"/></marker>
  </defs>
  <rect class="paper" width="1600" height="900"/>
  <rect class="band" width="1600" height="112"/>
  <text x="90.0" y="68.0" class="title" text-anchor="start"><tspan x="90.0" dy="0">수랭식 관련 발표의 별도 정규화 지수</tspan></text>
  <text x="90.0" y="154.0" class="subtitle" text-anchor="start"><tspan x="90.0" dy="0">연간 장애율과 평균 무고장 시간은 서로 다른 지표이므로 막대 길이를 상호 비교하지 않는다.</tspan></text>
  <line class="rule" x1="90" y1="182" x2="1510" y2="182"/>
  <line class="rule" x1="140.0" y1="675.0" x2="1500.0" y2="675.0"/>
  <text x="140.0" y="255.0" class="body" text-anchor="start"><tspan x="140.0" dy="0">단위: 공랭식 기준 지수</tspan></text>
  <g data-panel="annual-failure"><text x="480.0" y="270.0" class="small" text-anchor="middle"><tspan x="480.0" dy="0">연간 장애율 지수</tspan></text></g>
  <line class="rule" x1="820.0" y1="286" x2="820.0" y2="660"/>
  <g data-panel="mean-time-between-failure"><text x="1160.0" y="270.0" class="small" text-anchor="middle"><tspan x="1160.0" dy="0">평균 무고장 시간 지수</tspan></text></g>
  <rect data-panel="annual-failure" class="bar-teal" x="224.0" y="300.0" width="172.0" height="375.0" rx="8"/>
  <text x="310.0" y="284.0" class="value" text-anchor="middle"><tspan x="310.0" dy="0">100</tspan></text>
  <text x="310.0" y="714.0" class="small" text-anchor="middle"><tspan x="310.0" dy="0">장애율</tspan><tspan x="310.0" dy="30">공랭 기준</tspan></text>
  <rect data-panel="annual-failure" class="bar-navy" x="564.0" y="550.0" width="172.0" height="125.0" rx="8"/>
  <text x="650.0" y="534.0" class="value" text-anchor="middle"><tspan x="650.0" dy="0">33.3</tspan></text>
  <text x="650.0" y="714.0" class="small" text-anchor="middle"><tspan x="650.0" dy="0">장애율</tspan><tspan x="650.0" dy="30">수랭식</tspan></text>
  <rect data-panel="mean-time-between-failure" class="bar-amber" x="904.0" y="530.8" width="172.0" height="144.2" rx="8"/>
  <text x="990.0" y="514.8" class="value" text-anchor="middle"><tspan x="990.0" dy="0">100</tspan></text>
  <text x="990.0" y="714.0" class="small" text-anchor="middle"><tspan x="990.0" dy="0">무고장 시간</tspan><tspan x="990.0" dy="30">공랭 기준</tspan></text>
  <rect data-panel="mean-time-between-failure" class="bar-teal" x="1244.0" y="300.0" width="172.0" height="375.0" rx="8"/>
  <text x="1330.0" y="284.0" class="value" text-anchor="middle"><tspan x="1330.0" dy="0">260</tspan></text>
  <text x="1330.0" y="714.0" class="small" text-anchor="middle"><tspan x="1330.0" dy="0">무고장 시간</tspan><tspan x="1330.0" dy="30">수랭식</tspan></text>
  <line class="rule" x1="90" y1="770" x2="1510" y2="770"/>
  <text x="90.0" y="812.0" class="small" text-anchor="start"><tspan x="90.0" dy="0">증거 표시: 공식 발표</tspan></text>
  <text x="90.0" y="844.0" class="small" text-anchor="start"><tspan x="90.0" dy="0">근거: 공식 발표 | SRC-003</tspan></text>
  <text x="90.0" y="876.0" class="small" text-anchor="start"><tspan x="90.0" dy="0">CHT-004 | 공랭식 기준 100과 수랭식 장애율 약 33.3, 무고장 시간 260을 별도 지수로 보인 차트.</tspan></text>
</svg>
