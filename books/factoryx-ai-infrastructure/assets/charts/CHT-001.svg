<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="CHT-001-title CHT-001-desc">
  <title id="CHT-001-title">TOP500 LINPACK Rmax와 Rpeak</title>
  <desc id="CHT-001-desc">NIPA-NHN-Cloud-CL-1과 CL-2의 Rmax와 Rpeak를 PFlop/s 단위 막대로 비교한 TOP500 차트.</desc>
  <defs>
    <style>.paper { fill: #f7f5ef; }
.band { fill: #10324a; }
.surface { fill: #dce8e8; stroke: #10324a; stroke-width: 3; }
.surface-teal { fill: #d7eceb; stroke: #087e8b; stroke-width: 3; }
.surface-amber { fill: #f4e5c9; stroke: #d18b24; stroke-width: 3; }
.line { stroke: #7f9ba0; stroke-width: 4; fill: none; marker-end: url(#arrow); }
.rule { stroke: #7f9ba0; stroke-width: 2; }
.title { font-family: 'Noto Serif CJK KR', serif; font-size: 38px; font-weight: 700; fill: #f7f5ef; }
.subtitle { font-family: 'Noto Sans CJK KR', sans-serif; font-size: 22px; fill: #18313f; }
.body { font-family: 'Noto Sans CJK KR', sans-serif; font-size: 21px; fill: #18313f; }
.small { font-family: 'Noto Sans CJK KR', sans-serif; font-size: 17px; fill: #18313f; }
.value { font-family: 'Noto Sans CJK KR', sans-serif; font-size: 24px; font-weight: 700; fill: #10324a; }
.node-label { font-family: 'Noto Sans CJK KR', sans-serif; font-size: 21px; font-weight: 700; fill: #18313f; }
.bar-teal { fill: #087e8b; }
.bar-navy { fill: #10324a; }
.bar-amber { fill: #d18b24; }</style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><polygon points="0,0 12,6 0,12" fill="#7f9ba0"/></marker>
  </defs>
  <rect class="paper" width="1600" height="900"/>
  <rect class="band" width="1600" height="112"/>
  <text x="90.0" y="68.0" class="title" text-anchor="start"><tspan x="90.0" dy="0">TOP500 LINPACK Rmax와 Rpeak</tspan></text>
  <text x="90.0" y="154.0" class="subtitle" text-anchor="start"><tspan x="90.0" dy="0">NIPA-NHN-Cloud-CL-1과 CL-2의 2026년 6월 TOP500 원자료를 같은 LINPACK 축에서 본다.</tspan></text>
  <line class="rule" x1="90" y1="182" x2="1510" y2="182"/>
  <line class="rule" x1="140.0" y1="675.0" x2="1500.0" y2="675.0"/>
  <text x="140.0" y="255.0" class="body" text-anchor="start"><tspan x="140.0" dy="0">단위: PFlop/s</tspan></text>
  <rect data-panel="LINPACK" class="bar-teal" x="224.0" y="345.7" width="172.0" height="329.3" rx="8"/>
  <text x="310.0" y="329.7" class="value" text-anchor="middle"><tspan x="310.0" dy="0">137.40</tspan></text>
  <text x="310.0" y="714.0" class="small" text-anchor="middle"><tspan x="310.0" dy="0">CL-1</tspan><tspan x="310.0" dy="30">Rmax</tspan></text>
  <rect data-panel="LINPACK" class="bar-navy" x="564.0" y="300.0" width="172.0" height="375.0" rx="8"/>
  <text x="650.0" y="284.0" class="value" text-anchor="middle"><tspan x="650.0" dy="0">156.48</tspan></text>
  <text x="650.0" y="714.0" class="small" text-anchor="middle"><tspan x="650.0" dy="0">CL-1</tspan><tspan x="650.0" dy="30">Rpeak</tspan></text>
  <rect data-panel="LINPACK" class="bar-amber" x="904.0" y="511.0" width="172.0" height="164.0" rx="8"/>
  <text x="990.0" y="495.0" class="value" text-anchor="middle"><tspan x="990.0" dy="0">68.42</tspan></text>
  <text x="990.0" y="714.0" class="small" text-anchor="middle"><tspan x="990.0" dy="0">CL-2</tspan><tspan x="990.0" dy="30">Rmax</tspan></text>
  <rect data-panel="LINPACK" class="bar-teal" x="1244.0" y="488.2" width="172.0" height="186.8" rx="8"/>
  <text x="1330.0" y="472.2" class="value" text-anchor="middle"><tspan x="1330.0" dy="0">77.94</tspan></text>
  <text x="1330.0" y="714.0" class="small" text-anchor="middle"><tspan x="1330.0" dy="0">CL-2</tspan><tspan x="1330.0" dy="30">Rpeak</tspan></text>
  <line class="rule" x1="90" y1="770" x2="1510" y2="770"/>
  <text x="90.0" y="812.0" class="small" text-anchor="start"><tspan x="90.0" dy="0">증거 표시: 원자료</tspan></text>
  <text x="90.0" y="844.0" class="small" text-anchor="start"><tspan x="90.0" dy="0">근거: 원자료 | SRC-011</tspan></text>
  <text x="90.0" y="876.0" class="small" text-anchor="start"><tspan x="90.0" dy="0">CHT-001 | NIPA-NHN-Cloud-CL-1과 CL-2의 Rmax와 Rpeak를 PFlop/s 단위 막대로 비교한 TOP500 차트.</tspan></text>
</svg>
