book:
  title: NHN FactoryX 실전 설계
  metadata_title: 'NHN FactoryX 실전 설계: GPU 데이터센터에서 AI 에이전트 실행 환경까지'
  subtitle: GPU 데이터센터에서 AI 에이전트 실행 환경까지
  author: KLIC
  language: ko-KR
  short_title: FACTORYX AI INFRASTRUCTURE
  output_name: nhn-factoryx-ai-infrastructure-ko
  subject: NHN FactoryX 공개 자료를 기반으로 한 AI 인프라 설계·운영 실무서
  keywords:
    - NHN FactoryX
    - AI 인프라
    - GPU 클러스터
    - 수랭식 데이터센터
    - GPUaaS
    - MLOps
    - 프라이빗 AI
    - AI 에이전트
  edition_label: KLIC 독립 연구판 · 공개 자료 기준 2026-08-12
  copyright_notice: 이 책은 KLIC의 독립 연구 편집물이며 NHN Cloud 또는 NHN FactoryX의 공식 문서가 아니다. 제품명과 상표의 권리는 각 권리자에게 있다. 외부 사실과 수치는 장별 출처 원장에 표시했다.
  build_date: auto

files:
  include:
    - '*.md'
  exclude:
    - '**/build/**'
    - '**/_work/**'
  order:
    - 00-들어가며.md
    - 01-factoryx-풀스택.md
    - 02-워크로드-요구사항.md
    - 03-전력-열-수랭.md
    - 04-gpu-노드.md
    - 05-패브릭-스토리지.md
    - 06-성능-용량.md
    - 07-gpuaas-제어면.md
    - 08-mlops-수명주기.md
    - 09-관측-신뢰성-비용.md
    - 10-프라이빗-ai.md
    - 11-에이전트-실행환경.md
    - 12-도입-로드맵.md
    - 13-부록-a-출처-원장.md
    - 14-부록-b-검증-체크리스트.md
    - 15-부록-c-용어와-색인.md
  front_matter_file: 00-들어가며.md
  strip_front_matter_sections: []
  front_matter_drop_paragraphs: []
  strip_front_matter_leading_rules: false
  chapter_file_pattern: '^(0[1-9]|1[0-2])[-_].*\.md$'

editorial:
  preset: fde-midnight
  cover_theme: midnight
  include_cover: true
  include_title_page: true
  include_editorial_note: true
  include_generated_toc: true
  include_chapter_openers: true
  toc_depth: 2
  section_list_depth: 2
  toc_lead: FactoryX의 공개 3계층을 따라 인프라·플랫폼·서비스와 도입 판단을 위에서 아래로 읽습니다.
  cover_eyebrow: FACTORYX AI INFRASTRUCTURE
  cover_watermark: FX
  title_page_quote: AI 인프라는 GPU 구매 목록이 아니라 종단 간 운영 시스템이다.
  title_page_edition_label: KLIC 독립 연구판
  front_matter_header: ABOUT THIS BOOK
  chapter_eyebrow: CHAPTER
  appendix_eyebrow: APPENDIX
  editorial_note_title: 이 책의 근거와 경계
  editorial_note_paragraphs:
    - 이 책은 NHN FactoryX의 공식 공개 페이지와 기술별 1차 자료를 바탕으로 KLIC가 독립 집필한 실무서입니다. 신청형 기술 백서의 제공되지 않은 본문은 추정하지 않았습니다.
    - NHN 발표, 공개 원자료, 저자의 설계 해석과 실무 제안을 문법적으로 구분했습니다. FactoryX 내부 구현으로 확인되지 않은 기술은 업계 설계 대안으로만 설명합니다.
  editorial_note_footer_paragraphs:
    - 공개 자료 확인 기준일은 2026년 8월 12일입니다. 제품 기능과 문서 버전은 출판 전 다시 확인해야 합니다.
  build_date_format: korean
  cover_process_chips: [POWER, COOLING, GPU, FABRIC, PLATFORM, AGENT]

style:
  page_size: A4
  body_font: NanumMyeongjo, Noto Serif CJK KR, serif
  heading_font: NanumSquare, Noto Sans CJK KR, sans-serif
  mono_font: NanumGothicCoding, Noto Sans Mono CJK KR, monospace
  body_font_size_pt: 9.0
  body_line_height: 1.46
  colors:
    navy: '#081827'
    navy_alt: '#102B38'
    cyan: '#36C7D0'
    cyan_dark: '#0F8790'
    amber: '#D39A2C'
    ink: '#142131'
    text: '#283541'
    muted: '#7A8791'
    line: '#D8E1E2'
    wash: '#EFF5F4'
    paper: '#FFFFFF'
  margins_mm:
    top: 16
    right: 19
    bottom: 16
    left: 19
  extra_css: |
    .cover::after, .chapter-opener::after { background: none !important; }
    .accent-bar, .chapter-opener .bottom-line { background: var(--cyan) !important; }
    .chapter-visual::before { background: var(--cyan-dark) !important; }
    .toc-head { margin: 4mm 0 9mm; padding-bottom: 6mm; }
    .toc-item { margin-bottom: 4.8mm; padding-top: 3.4mm; }
    .toc-sections { margin-top: 1.8mm; }
    .toc-sections li { margin-bottom: 1mm; line-height: 1.44; }
    .chapter-body h2 { font-size: 18pt; margin: 7mm 0 4mm; }
    .chapter-body p { margin-bottom: 3.5mm; }
    .chapter-body table { margin: 4mm 0 5.5mm; line-height: 1.45; }
    .chapter-body th { padding: 1.8mm 2.2mm; }
    .chapter-body td { padding: 1.7mm 2.2mm; }
    .chapter-body.chapter-04 { font-size: 8.7pt; line-height: 1.40; }
    .chapter-body.chapter-04 table { font-size: 8pt; line-height: 1.35; }
    .chapter-body.chapter-04 th,
    .chapter-body.chapter-04 td { padding: 1.2mm 1.8mm; }
    .chapter-opener.kind-appendix { display: none; }
    .chapter-body.kind-appendix { break-before: page; font-size: 8.4pt; line-height: 1.34; }
    .chapter-body.kind-appendix h2 { font-size: 14.5pt; margin: 4.5mm 0 2.5mm; }
    .chapter-body.kind-appendix li { margin-bottom: 1.1mm; break-inside: avoid; }
    .chapter-body.chapter-13.kind-appendix ul,
    .chapter-body.chapter-15.kind-appendix ul { columns: 2; column-gap: 7mm; }
    .chapter-body.chapter-14.kind-appendix table { font-size: 7.2pt; line-height: 1.3; margin: 2.5mm 0 3.5mm; }
    .chapter-body.chapter-14.kind-appendix th,
    .chapter-body.chapter-14.kind-appendix td { padding: 1.1mm 1.5mm; }
    .source-label { font-family: var(--font-mono); font-size: 8.4pt; color: var(--muted); }
    figure img { max-height: 104mm; object-fit: contain; }
    figure figcaption { font-size: 8.4pt; line-height: 1.48; }

visuals:
  enabled: true
  auto_from_headings: false
  default_kicker: CHAPTER MAP
  default_note: '편집 요약: 본문의 장·절 구조와 핵심 문장을 재배열한 도식이며, 원문을 대체하지 않습니다.'
  chapters:
    '1장 FactoryX를 읽는 법':
      kicker: FULL STACK
      title: GPU 확보에서 에이전트 실행까지
      thesis: FactoryX는 물리 인프라, GPU 운영 플랫폼, 기업용 AI 실행 환경을 한 구조로 공개했다.
      diagram:
        layout: ladder
        label: THREE LAYERS
        steps:
          - {title: Infrastructure, text: 전력·냉각·GPU·패브릭}
          - {title: Platform, text: GPU Live·AI EasyMaker}
          - {title: Service, text: ProjectX와 업무 실행 환경}
      table:
        title: 근거 표시
        headers: [표식, 의미, 주의]
        rows:
          - ['공식 발표', NHN이 공개한 주장, 발표 주체 표시]
          - [원자료, 벤치마크·표준, 단위와 버전 표시]
          - [설계 해석, 저자의 의미 도출, 사실과 문장 분리]

    '2장 워크로드에서 시작하는 요구사항':
      kicker: REQUIREMENTS
      title: 워크로드를 자원과 운영 조건으로 번역한다
      thesis: 학습·추론·RAG·에이전트는 병목과 완료 조건이 다르므로 같은 GPU 풀이라도 요구사항을 분리해야 한다.
      diagram:
        layout: process
        label: DESIGN INPUT
        steps:
          - {title: 업무 결과, text: 완료 조건과 실패 비용}
          - {title: 워크로드, text: 학습·추론·검색·도구 실행}
          - {title: SLO, text: 지연·처리량·가용성·품질}
          - {title: 자원, text: GPU·패브릭·스토리지·전력}
      table:
        title: 워크로드별 첫 질문
        headers: [유형, 병목, 우선 확인]
        rows:
          - [학습, 동기화·체크포인트, 완료 시간]
          - [추론, 지연·메모리, 토큰 처리량]
          - [에이전트, 외부 의존성, 권한·복구]

    '3장 전력·열·D2C 수랭':
      kicker: THERMAL PATH
      title: 전력과 냉각은 하나의 장애 도메인이다
      thesis: 시설수와 기술 냉각수, CDU, cold plate를 분리해 설계하고 누수·펌프·전력 상실의 상태 전이를 검증한다.
      diagram:
        layout: process
        label: HEAT FLOW
        steps:
          - {title: GPU, text: 전력을 열로 변환}
          - {title: Cold plate, text: 부품에서 열을 포획}
          - {title: TCS, text: 랙 내부 냉각수 루프}
          - {title: CDU, text: 시설수와 열교환}
          - {title: FWS, text: 시설 열배출 계통}
      table:
        title: 온도를 섞지 않는 법
        headers: [측정점, 의미, 비교 금지]
        rows:
          - [시설 공급수, 데이터센터가 제공하는 물, GPU 접합부 온도]
          - [TCS 공급수, 장비 루프의 입구, 시설수 등급]
          - [GPU 온도, 부품 센서, 냉각수 온도]

    '4장 GPU 노드와 내부 패브릭':
      kicker: NODE TOPOLOGY
      title: 한 노드 안에도 거리와 병목이 있다
      thesis: GPU·HBM·CPU·NIC의 연결 경로를 먼저 이해해야 멀티 GPU 병렬화와 장애 격리를 설명할 수 있다.
      diagram:
        layout: network
        label: INSIDE A NODE
        hub: GPU FABRIC · NVLink·NVSwitch
        cards:
          - {title: GPU·HBM, text: 모델 상태와 연산}
          - {title: CPU·DRAM, text: 제어와 전처리}
          - {title: NIC·HCA, text: 노드 간 통신}
          - {title: NVMe, text: 로컬 데이터·체크포인트}
      table:
        title: 경로별 설계 질문
        headers: [경로, 확인할 것, 실패 영향]
        rows:
          - [GPU↔GPU, 토폴로지·대역폭, collective 지연]
          - [GPU↔NIC, NUMA·rail, 노드 간 병목]
          - [GPU↔Storage, DMA 경로, 입력 정체]

    '5장 InfiniBand·RDMA·집단 통신·스토리지':
      kicker: DATA MOVEMENT
      title: 연산보다 데이터 이동이 먼저 막힐 수 있다
      thesis: NDR400·RDMA·NCCL·MPI·GDS는 같은 기술이 아니라 서로 다른 계층의 데이터 이동 책임을 가진다.
      diagram:
        layout: bridge
        label: END-TO-END PATH
        left: {title: Compute, text: GPU·HBM·collective}
        center: {title: Fabric, text: NIC·RDMA·NDR400}
        right: {title: Storage, text: checkpoint·dataset·GDS}
        bands:
          - 제어면 · 토폴로지·라우팅·장애 상태
          - 데이터면 · gradient·activation·파일 블록
      table:
        title: 기술의 책임
        headers: [기술, 책임, 보장하지 않는 것]
        rows:
          - [RDMA, 원격 메모리 데이터 경로, 애플리케이션 효율]
          - [NCCL, GPU collective 구현, 패브릭 무혼잡]
          - [GDS, storage↔GPU DMA, 모든 파일시스템 지원]

    '6장 클러스터 성능·용량·벤치마크':
      kicker: METRICS
      title: 숫자는 단위와 워크로드를 함께 읽는다
      thesis: Rmax·Rpeak, FP8 EFlops, 학습 완료 시간, 추론 지연은 서로 다른 질문에 답한다.
      diagram:
        layout: matrix
        label: METRIC BOUNDARY
        headers: [지표, 답하는 질문, 비교 범위]
        rows:
          - [Rmax, LINPACK 실측 성능, 같은 시험]
          - [Rpeak, 이론 최대 성능, 같은 정의]
          - [FP8 EFlops, 저정밀 연산 규모, 같은 정밀도]
          - [업무 SLO, 실제 완료 조건, 같은 서비스]
      table:
        title: 용량 계획 입력
        headers: [입력, 단위, 오차 원인]
        rows:
          - [모델·배치, bytes·tokens, 커널·정밀도]
          - [통신량, bytes per step, 토폴로지·혼잡]
          - [완료 시간, seconds·hours, 큐·재시도]

    '7장 GPU 동적 할당과 GPUaaS 제어면':
      kicker: CONTROL PLANE
      title: 장치 표현·큐·분할·실행을 분리한다
      thesis: GPU Live의 공개 기능과 DRA·Kueue·MIG·Slurm의 업계 역할을 분리해야 검증 가능한 플랫폼 질문이 된다.
      diagram:
        layout: process
        label: ADMISSION TO EXECUTION
        steps:
          - {title: 요청, text: GPU 수·형태·기간}
          - {title: 큐·쿼터, text: 우선순위·공정 공유}
          - {title: 장치 할당, text: claim·GRES·분할}
          - {title: 실행, text: 노드 배치·격리}
          - {title: 회수, text: 완료·중단·재스케줄}
      table:
        title: 업계 설계 대안의 책임
        headers: [대안, 주 책임, FactoryX 여부]
        rows:
          - [DRA, 특수 장치 표현·할당, 미공개]
          - [Kueue, admission·quota·fair sharing, 미공개]
          - [MIG·GRES, 분할·HPC 장치 관리, 미공개]

    '8장 AI EasyMaker와 MLOps 수명주기':
      kicker: MODEL LIFECYCLE
      title: 학습보다 계보와 단계 전환이 오래 남는다
      thesis: 개발 환경에서 모델 등록·엔드포인트·롤백까지 모든 단계의 입력·산출물·승인 증거를 연결한다.
      diagram:
        layout: process
        label: MLOPS FLOW
        steps:
          - {title: 개발, text: notebook·dataset·code}
          - {title: 학습, text: experiment·metrics}
          - {title: 평가, text: gate·comparison}
          - {title: 등록, text: model·lineage}
          - {title: 배포, text: endpoint·stage·rollback}
      table:
        title: 단계별 보존 증거
        headers: [단계, 보존할 것, 재현 질문]
        rows:
          - [학습, code·image·data version, 다시 만들 수 있는가]
          - [평가, dataset·metric·threshold, 같은 판정을 내리는가]
          - [배포, model·config·traffic, 이전 상태로 돌아가는가]

    '9장 관측·신뢰성·에너지·비용':
      kicker: OPERATIONS
      title: GPU 신호에서 업무 결과까지 한 사고를 재구성한다
      thesis: 시설·노드·패브릭·큐·모델·업무 신호를 연결하되 각 계층의 단위를 보존한다.
      diagram:
        layout: ladder
        label: SIGNAL STACK
        steps:
          - {title: 시설, text: 전력·냉각·누수}
          - {title: 클러스터, text: GPU·NIC·큐·스토리지}
          - {title: 모델, text: 지연·처리량·오류·품질}
          - {title: 업무, text: 완료·승인·재작업}
      table:
        title: 최적화 가드레일
        headers: [최적화, 함께 볼 신호, 금지]
        rows:
          - [활용률, 큐 대기·완료 시간, 활용률만 최대화]
          - [에너지, 성능·열 여유, SLO 무시]
          - [비용, 품질·재시도·인력, GPU 비용만 계산]

    '10장 프라이빗 AI의 데이터·보안·거버넌스':
      kicker: TRUST BOUNDARY
      title: 프라이빗은 위치가 아니라 통제의 집합이다
      thesis: 데이터·테넌트·모델·도구·감사 경계를 정의하고 Govern·Map·Measure·Manage를 운영 루프로 만든다.
      diagram:
        layout: quadrant
        label: PRIVATE AI
        cards:
          - {title: Data, text: 위치·보존·학습 재사용}
          - {title: Identity, text: 사용자·서비스·도구 권한}
          - {title: Supply chain, text: model·image·dependency}
          - {title: Evidence, text: 평가·승인·감사·복구}
      table:
        title: AI RMF 적용
        headers: [기능, 핵심 질문, 증거]
        rows:
          - [Govern, 누가 책임지는가, 정책·역할]
          - [Map, 무엇이 위험한가, 맥락·영향]
          - [Measure·Manage, 어떻게 재고 줄이는가, 평가·조치 기록]

    '11장 엔터프라이즈 에이전트 실행 환경':
      kicker: AGENT RUNTIME
      title: 모델 출력과 실제 행동 사이에 정책을 둔다
