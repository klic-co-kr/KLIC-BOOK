<text x="100.0" y="150.0" font-family="NanumSquare_ac, NanumGothic, sans-serif" font-size="14" fill="#222222" text-anchor="middle" dominant-baseline="middle" font-weight='bold'>반복 측정</text>
<text x="100.0" y="170.0" font-family="NanumSquare_ac, NanumGothic, sans-serif" font-size="11.5" fill="#666666" text-anchor="middle" dominant-baseline="middle">로그에서 반복을 센다</text>
