<text x="16.0" y="26.0" font-family="NanumSquare_ac, NanumGothic, sans-serif" font-size="19" fill="#222222" text-anchor="start" dominant-baseline="middle" font-weight='bold'>이행은 반복 측정에서 지평 확장까지 여섯 걸음</text>
<text x="16.0" y="48.0" font-family="NanumSquare_ac, NanumGothic, sans-serif" font-size="13.5" fill="#555555" text-anchor="start" dominant-baseline="middle">측정이 정당화를, 계약과 검증이 구조를, 나란히 달리기가 승인을 만든다</text>
