<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Noto Sans KR','NanumSquare',sans-serif">
  <title>평균은 같아도 Hot Shard가 생기는 분포</title>
  <desc>평균 QPS는 같아도 한 테넌트가 쏠리면 상위 샤드 하나가 과부하되는 skew 분포를 보여준다. 예시 합성 데이터.</desc>
  <defs>
    <pattern id="hatchSkew" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)"><rect width="10" height="10" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="10" stroke="#283541" stroke-width="2.5"/></pattern>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <g id="heading">
    <text x="800" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#142131">평균 1000 QPS로 같아도 한 샤드가 타는 skew</text>
  </g>
  <g id="synthetic-note">
    <rect x="1240" y="92" width="240" height="44" rx="8" fill="#FFFFFF" stroke="#7A8791" stroke-width="1.5"/>
    <text x="1360" y="120" text-anchor="middle" font-size="22" fill="#7A8791">예시(합성 데이터)</text>
  </g>

  <g id="grid" stroke="#D8E1E2" stroke-width="1.5">
    <line x1="140" y1="740" x2="1480" y2="740"/>
    <line x1="140" y1="585" x2="1480" y2="585" stroke-dasharray="6 6"/>
    <line x1="140" y1="430" x2="1480" y2="430" stroke-dasharray="6 6"/>
    <line x1="140" y1="275" x2="1480" y2="275" stroke-dasharray="6 6"/>
    <line x1="140" y1="120" x2="1480" y2="120" stroke-dasharray="6 6"/>
  </g>

  <g id="axes" stroke="#142131" stroke-width="2.5">
    <line x1="140" y1="120" x2="140" y2="740"/>
    <line x1="140" y1="740" x2="1480" y2="740"/>
  </g>

  <g id="y-ticks" font-size="22" fill="#283541" text-anchor="end">
    <text x="128" y="748">0</text>
    <text x="128" y="593">1000</text>
    <text x="128" y="438">2000</text>
    <text x="128" y="283">3000</text>
    <text x="128" y="128">4000</text>
  </g>
  <text x="46" y="430" font-size="24" fill="#142131" transform="rotate(-90 46 430)" text-anchor="middle">QPS</text>

  <g id="avg-line">
    <line x1="140" y1="585" x2="1480" y2="585" stroke="#0F8790" stroke-width="2" stroke-dasharray="10 6"/>
    <text x="1460" y="572" text-anchor="end" font-size="22" fill="#0F8790" font-weight="700">두 분포의 평균 = 1000 QPS</text>
  </g>

  <g id="bars-even" fill="#0F8790" stroke="#142131" stroke-width="2">
    <rect x="171" y="585" width="76" height="155"/>
    <rect x="394" y="585" width="76" height="155"/>
    <rect x="617" y="585" width="76" height="155"/>
    <rect x="840" y="585" width="76" height="155"/>
    <rect x="1063" y="585" width="76" height="155"/>
    <rect x="1286" y="585" width="76" height="155"/>
  </g>

  <g id="bars-skew" fill="url(#hatchSkew)" stroke="#142131" stroke-width="2.5">
    <rect x="255" y="662" width="76" height="78"/>
    <rect x="478" y="662" width="76" height="78"/>
    <rect x="701" y="197" width="76" height="543"/>
    <rect x="924" y="662" width="76" height="78"/>
    <rect x="1147" y="662" width="76" height="78"/>
    <rect x="1370" y="662" width="76" height="78"/>
  </g>

  <text x="739" y="186" text-anchor="middle" font-size="24" font-weight="700" fill="#D39A2C">≈ 3500</text>
  <text x="293" y="760" text-anchor="middle" font-size="20" fill="#7A8791">500</text>

  <g id="x-labels" font-size="24" fill="#142131" text-anchor="middle" font-weight="700">
    <text x="251" y="800">Shard 1</text>
    <text x="474" y="800">Shard 2</text>
    <text x="697" y="800">Shard 3</text>
    <text x="920" y="800">Shard 4</text>
    <text x="1143" y="800">Shard 5</text>
    <text x="1366" y="800">Shard 6</text>
  </g>
  <text x="810" y="840" font-size="24" fill="#142131" text-anchor="middle">Shard ID</text>

  <g id="legend" font-size="22" fill="#283541">
    <rect x="430" y="858" width="22" height="14" fill="#0F8790" stroke="#142131" stroke-width="1.5"/>
    <text x="460" y="870">균등 분포(테넌트 고름)</text>
    <rect x="760" y="858" width="22" height="14" fill="url(#hatchSkew)" stroke="#142131" stroke-width="1.5"/>
    <text x="790" y="870">Skew 분포(hot 테넌트 → Shard 3 과부하)</text>
  </g>
</svg>
