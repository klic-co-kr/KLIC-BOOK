<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Noto Sans KR','NanumSquare',sans-serif">
  <title>추가 Dimension 수에 따른 예상 Series 수(예시)</title>
  <desc>bounded label 차원을 늘릴 때와 user_id 같은 고유 값 차원을 포함할 때, 조합 가능한 time series 수가 로그 축에서 어떻게 곱셈으로 증가하는지 보여준다. 합성 예시 데이터.</desc>
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <g id="heading">
    <text x="70" y="62" font-size="34" font-weight="700" fill="#142131">Dimension 수와 예상 Series 수(예시)</text>
    <text x="70" y="98" font-size="24" fill="#7A8791">label 차원을 더하면 시계열 조합이 곱셈으로 늘어난다</text>
  </g>

  <g id="synthetic-note">
    <rect x="1340" y="76" width="190" height="44" rx="8" fill="#FFFFFF" stroke="#7A8791" stroke-width="1.5"/>
    <text x="1435" y="104" text-anchor="middle" font-size="22" fill="#7A8791">예시(합성 데이터)</text>
  </g>

  <g id="grid" stroke="#D8E1E2" stroke-width="1.5">
    <line x1="200" y1="740" x2="1450" y2="740"/>
    <line x1="200" y1="668" x2="1450" y2="668" stroke-dasharray="6 6"/>
    <line x1="200" y1="595" x2="1450" y2="595" stroke-dasharray="6 6"/>
    <line x1="200" y1="523" x2="1450" y2="523" stroke-dasharray="6 6"/>
    <line x1="200" y1="450" x2="1450" y2="450" stroke-dasharray="6 6"/>
    <line x1="200" y1="378" x2="1450" y2="378" stroke-dasharray="6 6"/>
    <line x1="200" y1="305" x2="1450" y2="305" stroke-dasharray="6 6"/>
    <line x1="200" y1="233" x2="1450" y2="233" stroke-dasharray="6 6"/>
    <line x1="200" y1="160" x2="1450" y2="160" stroke-dasharray="6 6"/>
  </g>

  <g id="axes" stroke="#142131" stroke-width="2.5" fill="none">
    <line x1="200" y1="160" x2="200" y2="740"/>
    <line x1="200" y1="740" x2="1450" y2="740"/>
  </g>

  <g id="y-ticks" font-size="22" fill="#283541" text-anchor="end">
    <text x="188" y="748">10⁰</text>
    <text x="188" y="676">10¹</text>
    <text x="188" y="603">10²</text>
    <text x="188" y="531">10³</text>
    <text x="188" y="458">10⁴</text>
    <text x="188" y="386">10⁵</text>
    <text x="188" y="313">10⁶</text>
    <text x="188" y="241">10⁷</text>
    <text x="188" y="168">10⁸</text>
  </g>
  <text x="70" y="450" font-size="24" fill="#142131" font-weight="700" transform="rotate(-90 70 450)" text-anchor="middle">예상 Series 수 (로그 축)</text>

  <g id="x-ticks" font-size="24" fill="#142131" text-anchor="middle">
    <text x="340" y="784">1</text>
    <text x="605" y="784">2</text>
    <text x="870" y="784">3</text>
    <text x="1135" y="784">4</text>
    <text x="1400" y="784">5</text>
  </g>
  <text x="825" y="828" font-size="26" fill="#142131" font-weight="700" text-anchor="middle">추가 Dimension 수</text>

  <g id="series-bounded" fill="none">
    <polyline points="340,675 605,609 870,544 1135,478 1400,412" stroke="#0F8790" stroke-width="3"/>
    <g fill="#0F8790" stroke="#142131" stroke-width="2">
      <circle cx="340" cy="675" r="9"/>
      <circle cx="605" cy="609" r="9"/>
      <circle cx="870" cy="544" r="9"/>
      <circle cx="1135" cy="478" r="9"/>
      <circle cx="1400" cy="412" r="9"/>
    </g>
  </g>

  <g id="series-userid" fill="none">
    <polyline points="340,457 605,391 870,326 1135,261 1400,195" stroke="#D39A2C" stroke-width="3" stroke-dasharray="14 8"/>
    <g fill="#FFFFFF" stroke="#142131" stroke-width="2.5">
      <rect x="330" y="447" width="20" height="20"/>
      <rect x="595" y="381" width="20" height="20"/>
      <rect x="860" y="316" width="20" height="20"/>
      <rect x="1125" y="251" width="20" height="20"/>
      <rect x="1390" y="185" width="20" height="20"/>
    </g>
  </g>

  <g id="direct-labels" font-size="24" font-weight="700">
    <text x="1395" y="402" text-anchor="end" fill="#0F8790">bounded labels</text>
    <text x="1395" y="175" text-anchor="end" fill="#D39A2C">user_id 포함</text>
  </g>

  <g id="legend" font-size="22" fill="#283541">
    <line x1="220" y1="858" x2="280" y2="858" stroke="#0F8790" stroke-width="3"/>
    <circle cx="250" cy="858" r="7" fill="#0F8790" stroke="#142131" stroke-width="2"/>
    <text x="292" y="866">bounded labels (차원당 작은 집합)</text>
    <line x1="720" y1="858" x2="780" y2="858" stroke="#D39A2C" stroke-width="3" stroke-dasharray="14 8"/>
    <rect x="740" y="848" width="20" height="20" fill="#FFFFFF" stroke="#142131" stroke-width="2.5"/>
    <text x="792" y="866">user_id 포함 (고유 값 차원)</text>
    <text x="1180" y="866" fill="#7A8791">합성 예시 · 실제 측정 아님</text>
  </g>
</svg>
