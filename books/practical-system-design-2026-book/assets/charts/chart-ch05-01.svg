<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Noto Sans KR','NanumSquare',sans-serif">
  <title>같은 평균, 다른 꼬리: 두 latency 분포의 누적 분포</title>
  <desc>평균이 같아도 분포 A는 낮은 p99를, 분포 B는 긴 꼬리로 높은 p99를 갖는다. 예시 합성 데이터.</desc>
  <defs>
    <pattern id="hatchB" patternUnits="userSpaceOnUse" width="9" height="9" patternTransform="rotate(45)"><rect width="9" height="9" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="9" stroke="#283541" stroke-width="2.5"/></pattern>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <g id="heading">
    <text x="800" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#142131">같은 평균을 가져도 p99는 다를 수 있다</text>
  </g>

  <g id="synthetic-note">
    <rect x="1240" y="92" width="240" height="44" rx="8" fill="#FFFFFF" stroke="#7A8791" stroke-width="1.5"/>
    <text x="1360" y="120" text-anchor="middle" font-size="22" fill="#7A8791">예시(합성 데이터)</text>
  </g>

  <g id="grid" stroke="#D8E1E2" stroke-width="1.5">
    <line x1="140" y1="760" x2="1480" y2="760"/>
    <line x1="140" y1="632" x2="1480" y2="632" stroke-dasharray="6 6"/>
    <line x1="140" y1="504" x2="1480" y2="504" stroke-dasharray="6 6"/>
    <line x1="140" y1="376" x2="1480" y2="376" stroke-dasharray="6 6"/>
    <line x1="140" y1="248" x2="1480" y2="248" stroke-dasharray="6 6"/>
    <line x1="140" y1="120" x2="1480" y2="120" stroke-dasharray="6 6"/>
  </g>

  <g id="axes" stroke="#142131" stroke-width="2.5">
    <line x1="140" y1="120" x2="140" y2="760"/>
    <line x1="140" y1="760" x2="1480" y2="760"/>
  </g>

  <g id="y-ticks" font-size="22" fill="#283541" text-anchor="end">
    <text x="128" y="768">0</text>
    <text x="128" y="640">20</text>
    <text x="128" y="512">40</text>
    <text x="128" y="384">60</text>
    <text x="128" y="256">80</text>
    <text x="128" y="128">100</text>
  </g>
  <text x="60" y="440" font-size="24" fill="#142131" transform="rotate(-90 60 440)" text-anchor="middle">누적 요청 비율(%)</text>

  <g id="x-ticks" font-size="22" fill="#283541" text-anchor="middle">
    <text x="140" y="794">0</text>
    <text x="363" y="794">100</text>
    <text x="587" y="794">200</text>
    <text x="810" y="794">300</text>
    <text x="1033" y="794">400</text>
    <text x="1257" y="794">500</text>
    <text x="1480" y="794">600</text>
  </g>
  <text x="810" y="836" font-size="24" fill="#142131" text-anchor="middle">응답 지연(ms)</text>

  <g id="series-a">
    <polyline points="140,760 162,696 185,504 207,312 229,184 274,126 319,120" fill="none" stroke="#0F8790" stroke-width="3"/>
    <g fill="#0F8790" stroke="#FFFFFF" stroke-width="2">
      <circle cx="140" cy="760" r="7"/><circle cx="162" cy="696" r="7"/><circle cx="185" cy="504" r="7"/><circle cx="207" cy="312" r="7"/><circle cx="229" cy="184" r="7"/><circle cx="274" cy="126" r="7"/><circle cx="319" cy="120" r="7"/>
    </g>
  </g>

  <g id="series-b">
    <polyline points="140,760 162,728 207,568 252,440 363,216 587,152 1033,126 1480,120" fill="none" stroke="#283541" stroke-width="3" stroke-dasharray="12 8"/>
    <g fill="#FFFFFF" stroke="#283541" stroke-width="2.5">
      <rect x="134" y="754" width="12" height="12"/><rect x="156" y="722" width="12" height="12"/><rect x="201" y="562" width="12" height="12"/><rect x="246" y="434" width="12" height="12"/><rect x="357" y="210" width="12" height="12"/><rect x="581" y="146" width="12" height="12"/><rect x="1027" y="120" width="12" height="12"/><rect x="1474" y="114" width="12" height="12"/>
    </g>
  </g>

  <g id="p99-a">
    <line x1="274" y1="760" x2="274" y2="126" stroke="#0F8790" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="300" y="700" font-size="22" fill="#0F8790" font-weight="700">p99 ≈ 60ms</text>
  </g>
  <g id="p99-b">
    <line x1="1033" y1="760" x2="1033" y2="126" stroke="#283541" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="1055" y="300" font-size="22" fill="#283541" font-weight="700">p99 ≈ 400ms</text>
  </g>

  <g id="direct-labels" font-size="24" font-weight="700">
    <text x="120" y="540" fill="#0F8790">분포 A</text>
    <text x="430" y="180" fill="#283541">분포 B(긴 꼬리)</text>
  </g>

  <g id="legend" font-size="22" fill="#283541">
    <line x1="600" y1="858" x2="680" y2="858" stroke="#0F8790" stroke-width="3"/>
    <circle cx="640" cy="858" r="6" fill="#0F8790"/>
    <text x="690" y="866">분포 A(단단한 분포)</text>
    <line x1="980" y1="858" x2="1060" y2="858" stroke="#283541" stroke-width="3" stroke-dasharray="12 8"/>
    <rect x="1014" y="852" width="12" height="12" fill="#FFFFFF" stroke="#283541" stroke-width="2.5"/>
    <text x="1070" y="866">분포 B(긴 꼬리)</text>
  </g>
</svg>
