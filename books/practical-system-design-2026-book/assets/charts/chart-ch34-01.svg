<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Noto Sans KR','NanumSquare',sans-serif">
  <title>정책 후보 품질-비용 산포와 Pareto frontier(합성)</title>
  <desc>여러 model/routing 정책을 품질과 accepted-outcome당 비용으로 비교하고, 지배되는 Pareto 선택을 표시하는 합성 차트.</desc>
  <defs>
    <marker id="arrow-axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#283541"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <g id="title">
    <text x="60" y="70" font-size="32" font-weight="700" fill="#142131">정책 후보 비교: 품질 vs 비용</text>
    <text x="60" y="106" font-size="22" fill="#7A8791">Pareto frontier 위 정책만이 지배적 선택지(더 싸면서 더 좋은 대안이 없음)</text>
  </g>

  <g id="synthetic-note">
    <rect x="1240" y="130" width="280" height="44" rx="8" fill="#FFF7E8" stroke="#D39A2C" stroke-width="2"/>
    <text x="1380" y="159" text-anchor="middle" font-size="22" fill="#D39A2C">예시(합성 데이터)</text>
  </g>

  <g id="axes" stroke="#283541" fill="none" stroke-width="2.5">
    <line x1="200" y1="140" x2="200" y2="680"/>
    <line x1="200" y1="680" x2="1460" y2="680" marker-end="url(#arrow-axis)"/>
    <line x1="200" y1="140" x2="200" y2="120" marker-end="url(#arrow-axis)"/>
  </g>

  <g id="grid" stroke="#D8E1E2" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="200" y1="560" x2="1460" y2="560"/>
    <line x1="200" y1="460" x2="1460" y2="460"/>
    <line x1="200" y1="360" x2="1460" y2="360"/>
    <line x1="200" y1="260" x2="1460" y2="260"/>
    <line x1="200" y1="160" x2="1460" y2="160"/>
    <line x1="468" y1="140" x2="468" y2="680"/>
    <line x1="696" y1="140" x2="696" y2="680"/>
    <line x1="924" y1="140" x2="924" y2="680"/>
    <line x1="1152" y1="140" x2="1152" y2="680"/>
    <line x1="1380" y1="140" x2="1380" y2="680"/>
  </g>

  <g id="y-ticks" font-size="22" fill="#283541">
    <text x="185" y="688" text-anchor="end">0</text>
    <text x="185" y="568" text-anchor="end">0.2</text>
    <text x="185" y="468" text-anchor="end">0.4</text>
    <text x="185" y="368" text-anchor="end">0.6</text>
    <text x="185" y="268" text-anchor="end">0.8</text>
    <text x="185" y="168" text-anchor="end">1.0</text>
  </g>

  <g id="x-ticks" font-size="22" fill="#283541">
    <text x="240" y="718" text-anchor="middle">0</text>
    <text x="468" y="718" text-anchor="middle">0.2</text>
    <text x="696" y="718" text-anchor="middle">0.4</text>
    <text x="924" y="718" text-anchor="middle">0.6</text>
    <text x="1152" y="718" text-anchor="middle">0.8</text>
    <text x="1380" y="718" text-anchor="middle">1.0</text>
  </g>

  <g id="axis-titles" font-size="24" fill="#142131">
    <text x="830" y="780" text-anchor="middle">Accepted Outcome당 비용(상대적)</text>
    <text x="80" y="410" text-anchor="middle" transform="rotate(-90 80 410)">품질 점수(정규화)</text>
  </g>

  <g id="candidates" stroke="#7A8791" stroke-width="2.5" fill="#FFFFFF">
    <circle cx="582" cy="410" r="9"/>
    <circle cx="719" cy="335" r="9"/>
    <circle cx="901" cy="285" r="9"/>
    <circle cx="1061" cy="250" r="9"/>
    <circle cx="1243" cy="220" r="9"/>
  </g>
  <text x="745" y="325" font-size="22" fill="#7A8791">정책 후보(지배됨)</text>
  <line x1="740" y1="330" x2="725" y2="335" stroke="#7A8791" stroke-width="2"/>

  <g id="pareto-line" fill="none" stroke="#0F8790" stroke-width="3.5">
    <polyline points="411,435 491,385 639,310 810,270 981,235 1152,210 1323,195"/>
  </g>

  <g id="pareto-points" fill="#0F8790" stroke="#FFFFFF" stroke-width="2">
    <circle cx="411" cy="435" r="11"/>
    <circle cx="491" cy="385" r="11"/>
    <circle cx="639" cy="310" r="11"/>
    <circle cx="810" cy="270" r="11"/>
    <circle cx="981" cy="235" r="11"/>
    <circle cx="1152" cy="210" r="11"/>
    <circle cx="1323" cy="195" r="11"/>
  </g>

  <g id="pareto-label">
    <text x="640" y="170" font-size="24" font-weight="700" fill="#0F8790">Pareto frontier</text>
    <line x1="700" y1="178" x2="755" y2="225" stroke="#0F8790" stroke-width="2"/>
  </g>

  <g id="direction-note" font-size="22" fill="#7A8791">
    <text x="1180" y="630">← 더 저렴</text>
    <text x="1340" y="155" text-anchor="end">더 높은 품질 ↑</text>
  </g>

  <g id="legend" font-size="22" fill="#283541">
    <circle cx="280" cy="845" r="10" fill="#0F8790" stroke="#FFFFFF" stroke-width="2"/>
    <text x="300" y="852">Pareto frontier 위 정책</text>
    <circle cx="560" cy="845" r="9" fill="#FFFFFF" stroke="#7A8791" stroke-width="2.5"/>
    <text x="580" y="852">지배되는 정책 후보</text>
  </g>
</svg>
