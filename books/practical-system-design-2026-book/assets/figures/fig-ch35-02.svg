<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Noto Sans KR','NanumSquare',sans-serif">
  <title>전역 URL 단축 아키텍처</title>
  <desc>edge·regional cache·single writer·event log·analytics를 포함한 전역 구조를 보여준다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#283541"/></marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0F8790"/></marker>
    <marker id="arrow-amb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D39A2C"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <g id="header">
    <text x="80" y="78" font-size="30" font-weight="700" fill="#142131">전역 URL 단축 아키텍처</text>
    <text x="80" y="114" font-size="24" fill="#7A8791">edge·regional cache·single writer·event log·analytics</text>
  </g>

  <g id="legend" font-size="22" fill="#283541">
    <line x1="990" y1="92" x2="1070" y2="92" stroke="#283541" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="1082" y="100">read 경로</text>
    <line x1="1230" y1="92" x2="1310" y2="92" stroke="#0F8790" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
    <text x="1322" y="100">write 경로</text>
    <line x1="1430" y1="92" x2="1510" y2="92" stroke="#D39A2C" stroke-width="2.5" stroke-dasharray="10 6" marker-end="url(#arrow-amb)"/>
    <text x="1522" y="100">비동기</text>
  </g>

  <g id="nodes">
    <g id="users">
      <rect x="60" y="420" width="200" height="100" rx="14" fill="#F4F8FA" stroke="#0F8790" stroke-width="2.5"/>
      <text x="160" y="478" text-anchor="middle" font-size="28" font-weight="600" fill="#142131">사용자</text>
    </g>

    <g id="edge">
      <rect x="320" y="380" width="240" height="180" rx="16" fill="#FFFFFF" stroke="#142131" stroke-width="2.5"/>
      <text x="440" y="440" text-anchor="middle" font-size="30" font-weight="600" fill="#142131">Edge</text>
      <text x="440" y="478" text-anchor="middle" font-size="22" fill="#7A8791">redirect·TLS</text>
      <text x="440" y="510" text-anchor="middle" font-size="22" fill="#7A8791">edge cache</text>
    </g>

    <g id="regional-cache">
      <rect x="640" y="380" width="260" height="180" rx="16" fill="#F4F8FA" stroke="#0F8790" stroke-width="2.5"/>
      <text x="770" y="440" text-anchor="middle" font-size="30" font-weight="600" fill="#142131">Regional Cache</text>
      <text x="770" y="478" text-anchor="middle" font-size="22" fill="#7A8791">인기 code</text>
      <text x="770" y="510" text-anchor="middle" font-size="22" fill="#7A8791">tombstone</text>
    </g>

    <g id="urldb">
      <rect x="1000" y="380" width="260" height="180" rx="16" fill="#EFF5F4" stroke="#0F8790" stroke-width="2.5"/>
      <text x="1130" y="440" text-anchor="middle" font-size="30" font-weight="600" fill="#142131">URL DB</text>
      <text x="1130" y="478" text-anchor="middle" font-size="22" fill="#7A8791">원장·replica</text>
      <text x="1130" y="510" text-anchor="middle" font-size="22" fill="#7A8791">destination</text>
    </g>

    <g id="single-writer">
      <rect x="1330" y="180" width="230" height="140" rx="16" fill="#FFFFFF" stroke="#0F8790" stroke-width="2.5"/>
      <text x="1445" y="240" text-anchor="middle" font-size="28" font-weight="600" fill="#142131">Single Writer</text>
      <text x="1445" y="278" text-anchor="middle" font-size="22" fill="#7A8791">단일 쓰기 소유</text>
    </g>

    <g id="abuse">
      <rect x="320" y="640" width="240" height="120" rx="14" fill="#FFFFFF" stroke="#142131" stroke-width="2.5"/>
      <text x="440" y="690" text-anchor="middle" font-size="28" font-weight="600" fill="#142131">Abuse Service</text>
      <text x="440" y="724" text-anchor="middle" font-size="22" fill="#7A8791">사전·사후 검증</text>
    </g>

    <g id="event-log">
      <rect x="640" y="640" width="260" height="120" rx="14" fill="#FFFFFF" stroke="#D39A2C" stroke-width="2.5"/>
      <text x="770" y="690" text-anchor="middle" font-size="28" font-weight="600" fill="#142131">Event Log</text>
      <text x="770" y="724" text-anchor="middle" font-size="22" fill="#7A8791">click event</text>
    </g>

    <g id="analytics">
      <rect x="1000" y="640" width="260" height="120" rx="14" fill="#F4F8FA" stroke="#0F8790" stroke-width="2.5"/>
      <text x="1130" y="690" text-anchor="middle" font-size="28" font-weight="600" fill="#142131">Analytics</text>
      <text x="1130" y="724" text-anchor="middle" font-size="22" fill="#7A8791">집계·리포트</text>
    </g>
  </g>

  <g id="edges" fill="none">
    <path d="M260 470 L320 470" stroke="#283541" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M560 470 L640 470" stroke="#283541" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="572" y="458" font-size="22" fill="#283541">cache 조회</text>
    <path d="M900 470 L1000 470" stroke="#283541" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="908" y="458" font-size="22" fill="#283541">miss</text>

    <path d="M260 440 L290 440 L290 250 L1445 250 L1445 320" stroke="#0F8790" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
    <text x="700" y="238" font-size="22" fill="#0F8790">create (단일 writer 경로)</text>
    <path d="M1330 250 L1260 250 L1260 380" stroke="#0F8790" stroke-width="2.5" marker-end="url(#arrow-accent)"/>

    <path d="M440 560 L440 640" stroke="#D39A2C" stroke-width="2.5" stroke-dasharray="10 6" marker-end="url(#arrow-amb)"/>
    <path d="M560 680 L640 680" stroke="#D39A2C" stroke-width="2.5" stroke-dasharray="10 6" marker-end="url(#arrow-amb)"/>
    <path d="M900 700 L1000 700" stroke="#D39A2C" stroke-width="2.5" stroke-dasharray="10 6" marker-end="url(#arrow-amb)"/>
  </g>

  <g id="step-tag">
    <rect x="80" y="810" width="320" height="50" rx="10" fill="#EFF5F4" stroke="#0F8790" stroke-width="2"/>
    <text x="240" y="843" text-anchor="middle" font-size="22" font-weight="600" fill="#0F8790">STEP 2 · 전역 edge·write 소유 분리</text>
  </g>
</svg>
