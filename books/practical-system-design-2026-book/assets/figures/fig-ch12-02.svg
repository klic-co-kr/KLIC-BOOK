<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Noto Sans KR','NanumSquare',sans-serif">
  <title>Fencing Token이 오래된 쓰기를 막는 과정</title>
  <desc>오래된 워커와 새 워커가 같은 공유 자원에 접근할 때, Fencing Token이 단조 증가하여 오래된 워커의 stale write가 거부되는 모습을 보여준다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#283541"/></marker>
    <marker id="arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0F8790"/></marker>
    <marker id="arrow-amb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D39A2C"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <g id="heading">
    <text x="800" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#142131">Fencing Token: 깨어난 옛 워커의 쓰기를 거부한다</text>
  </g>

  <g id="legend" font-size="22" fill="#283541">
    <line x1="1080" y1="80" x2="1160" y2="80" stroke="#0F8790" stroke-width="2.5"/><text x="1170" y="88">수락(높은 Token)</text>
    <line x1="1340" y1="80" x2="1420" y2="80" stroke="#D39A2C" stroke-width="2.5" stroke-dasharray="10 6"/><text x="1430" y="88">거부(낮은 Token)</text>
  </g>

  <g id="lanes" font-size="28" fill="#142131" text-anchor="middle" font-weight="700">
    <rect x="60" y="130" width="240" height="70" rx="14" fill="#FFFFFF" stroke="#D39A2C" stroke-width="2.5" stroke-dasharray="10 6"/>
    <text x="180" y="173">Worker A</text>
    <rect x="60" y="400" width="240" height="70" rx="14" fill="#EFF5F4" stroke="#0F8790" stroke-width="2.5"/>
    <text x="180" y="443">Worker B</text>
    <rect x="60" y="670" width="240" height="70" rx="14" fill="#F4F8FA" stroke="#142131" stroke-width="2.5"/>
    <text x="180" y="713">공유 자원</text>
  </g>

  <g id="lifelines" stroke="#D8E1E2" stroke-width="2" stroke-dasharray="6 6">
    <line x1="180" y1="200" x2="180" y2="650"/>
    <line x1="180" y1="470" x2="180" y2="650"/>
  </g>

  <g id="worker-a" font-size="22" fill="#142131">
    <rect x="360" y="200" width="280" height="64" rx="10" fill="#FFFFFF" stroke="#7A8791" stroke-width="2"/>
    <text x="500" y="240" text-anchor="middle">Lease 획득 · Token = 1</text>
    <path d="M300 230 L360 230" fill="none" stroke="#283541" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="720" y="260" width="280" height="64" rx="10" fill="#FFFFFF" stroke="#D39A2C" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="860" y="300" text-anchor="middle" fill="#D39A2C">일시 정지(GC·멈춤)</text>
    <path d="M640 232 L720 292" fill="none" stroke="#7A8791" stroke-width="2"/>

    <rect x="1080" y="360" width="320" height="64" rx="10" fill="#FFFFFF" stroke="#D39A2C" stroke-width="2.5" stroke-dasharray="8 5"/>
    <text x="1240" y="400" text-anchor="middle" fill="#D39A2C">깨어남 · 쓰기(Token 1)</text>
    <path d="M1000 292 C 1060 292, 1060 392, 1080 392" fill="none" stroke="#D39A2C" stroke-width="2.5" stroke-dasharray="10 6" marker-end="url(#arrow-amb)"/>
  </g>

  <g id="worker-b" font-size="22" fill="#142131">
    <rect x="720" y="470" width="280" height="64" rx="10" fill="#FFFFFF" stroke="#7A8791" stroke-width="2"/>
    <text x="860" y="510" text-anchor="middle">Lease 만료 후 재취득 · Token = 2</text>
    <path d="M300 502 L720 502" fill="none" stroke="#0F8790" stroke-width="2.5" marker-end="url(#arrow-acc)"/>

    <rect x="1080" y="540" width="320" height="64" rx="10" fill="#FFFFFF" stroke="#0F8790" stroke-width="2.5"/>
    <text x="1240" y="580" text-anchor="middle" fill="#0F8790">쓰기(Token 2)</text>
    <path d="M1000 502 C 1060 502, 1060 572, 1080 572" fill="none" stroke="#0F8790" stroke-width="2.5" marker-end="url(#arrow-acc)"/>
  </g>

  <g id="resource" font-size="22" fill="#142131">
    <path d="M1240 424 C 1240 600, 1240 640, 1240 670" fill="none" stroke="#D39A2C" stroke-width="2.5" stroke-dasharray="10 6" marker-end="url(#arrow-amb)"/>
    <rect x="1080" y="700" width="280" height="60" rx="10" fill="#FFFFFF" stroke="#D39A2C" stroke-width="2.5"/>
    <text x="1220" y="738" text-anchor="middle" fill="#D39A2C" font-weight="700" font-size="26">거부</text>
    <text x="1350" y="738" font-size="22" fill="#D39A2C">Token 1 &lt; 2</text>

    <path d="M1240 604 C 1240 640, 1240 660, 1240 670" fill="none" stroke="#0F8790" stroke-width="2.5" marker-end="url(#arrow-acc)"/>
    <rect x="700" y="700" width="320" height="60" rx="10" fill="#0F8790"/>
    <text x="860" y="738" text-anchor="middle" fill="#FFFFFF" font-weight="700" font-size="26">수락(Token 2 = 최신)</text>
  </g>

  <g id="token-note">
    <rect x="420" y="120" width="640" height="0" fill="none"/>
    <text x="800" y="820" text-anchor="middle" font-size="24" fill="#7A8791">Fencing Token은 Lease를 발급할 때마다 단조 증가하는 번호</text>
    <text x="800" y="852" text-anchor="middle" font-size="24" fill="#7A8791">공유 자원은 자신이 본 가장 높은 Token보다 낮은 쓰기를 모두 거부한다</text>
  </g>
</svg>
