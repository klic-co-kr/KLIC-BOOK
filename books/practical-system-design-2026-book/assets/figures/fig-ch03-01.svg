<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Noto Sans KR','NanumSquare',sans-serif">
  <title>ADR 생명주기</title>
  <desc>아키텍처 결정이 제안에서 결정·결과·재검토로 이어지고, 제안 단계에서 근거와 대안이 함께 검토되는 생명주기를 보여준다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#283541"/></marker>
    <marker id="arrow-mut" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7A8791"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0F8790"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <g id="legend" font-size="22" fill="#283541">
    <line x1="1180" y1="68" x2="1260" y2="68" stroke="#283541" stroke-width="2.5"/>
    <text x="1272" y="76">순방향</text>
    <line x1="1360" y1="68" x2="1440" y2="68" stroke="#7A8791" stroke-width="2.5" stroke-dasharray="10 8"/>
    <text x="1452" y="76">되머임</text>
  </g>

  <g id="nodes">
    <g id="rationale">
      <rect x="110" y="180" width="180" height="100" rx="12" fill="#F4F8FA" stroke="#142131" stroke-width="2.5"/>
      <text x="200" y="242" text-anchor="middle" font-size="30" fill="#142131">근거</text>
    </g>
    <g id="alternatives">
      <rect x="310" y="180" width="180" height="100" rx="12" fill="#F4F8FA" stroke="#142131" stroke-width="2.5"/>
      <text x="400" y="242" text-anchor="middle" font-size="30" fill="#142131">대안</text>
    </g>
    <g id="propose">
      <rect x="110" y="380" width="380" height="160" rx="16" fill="#F4F8FA" stroke="#0F8790" stroke-width="3.5"/>
      <text x="300" y="473" text-anchor="middle" font-size="38" fill="#142131">제안</text>
    </g>
    <g id="decision">
      <rect x="580" y="380" width="220" height="160" rx="16" fill="#FFFFFF" stroke="#142131" stroke-width="2.5"/>
      <text x="690" y="473" text-anchor="middle" font-size="36" fill="#142131">결정</text>
    </g>
    <g id="outcome">
      <rect x="890" y="380" width="220" height="160" rx="16" fill="#FFFFFF" stroke="#142131" stroke-width="2.5"/>
      <text x="1000" y="473" text-anchor="middle" font-size="36" fill="#142131">결과</text>
    </g>
    <g id="revisit">
      <rect x="1200" y="380" width="220" height="160" rx="16" fill="#FFFFFF" stroke="#142131" stroke-width="2.5"/>
      <text x="1310" y="473" text-anchor="middle" font-size="36" fill="#142131">재검토</text>
    </g>
  </g>

  <g id="edges" font-size="24" fill="#283541">
    <path d="M200 280 L200 380" stroke="#283541" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <path d="M400 280 L400 380" stroke="#283541" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

    <path d="M490 460 L580 460" stroke="#283541" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <text x="535" y="446" text-anchor="middle" font-size="22">검증·승인</text>

    <path d="M800 460 L890 460" stroke="#283541" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <text x="845" y="446" text-anchor="middle" font-size="22">적용</text>

    <path d="M1110 460 L1200 460" stroke="#283541" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <text x="1155" y="446" text-anchor="middle" font-size="22">관측</text>

    <path d="M1310 540 L1310 760 L300 760 L300 540" stroke="#7A8791" stroke-width="2.5" stroke-dasharray="10 8" fill="none" marker-end="url(#arrow-mut)"/>
    <text x="805" y="750" text-anchor="middle" fill="#7A8791" font-size="24">재검토 루프: 환경 변화 시 제안 재개</text>
  </g>
</svg>
