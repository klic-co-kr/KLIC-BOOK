<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Noto Sans KR','NanumSquare',sans-serif">
  <title>MVCC 스냅샷과 행 버전</title>
  <desc>두 트랜잭션의 스냅샷이 여러 행 버전을 다르게 보는 과정을 시간축으로 보여준다. 커밋과 정리 시점을 함께 표시한다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#283541"/></marker>
    <marker id="arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0F8790"/></marker>
    <marker id="arrow-amb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D39A2C"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <g id="heading">
    <text x="800" y="64" text-anchor="middle" font-size="34" font-weight="700" fill="#142131">MVCC: 각 트랜잭션은 자기 스냅샷이 찍힌 순간의 행 버전만 본다</text>
  </g>

  <g id="time-axis">
    <line x1="120" y1="760" x2="1500" y2="760" stroke="#7A8791" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="120" y="800" font-size="24" fill="#7A8791">시간</text>
  </g>

  <g id="txn-a">
    <rect x="80" y="160" width="200" height="80" rx="14" fill="#EFF5F4" stroke="#0F8790" stroke-width="2.5"/>
    <text x="180" y="210" text-anchor="middle" font-size="28" font-weight="700" fill="#142131">트랜잭션 A</text>
    <rect x="300" y="180" width="600" height="40" rx="8" fill="#EFF5F4" stroke="#0F8790" stroke-width="2"/>
    <text x="600" y="208" text-anchor="middle" font-size="22" fill="#0F8790">실행 구간</text>
    <line x1="320" y1="160" x2="320" y2="660" stroke="#0F8790" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="320" y="148" text-anchor="middle" font-size="22" fill="#0F8790" font-weight="700">스냅샷 A</text>
  </g>

  <g id="txn-b">
    <rect x="80" y="360" width="200" height="80" rx="14" fill="#F4F8FA" stroke="#142131" stroke-width="2.5"/>
    <text x="180" y="410" text-anchor="middle" font-size="28" font-weight="700" fill="#142131">트랜잭션 B</text>
    <rect x="640" y="380" width="660" height="40" rx="8" fill="#F4F8FA" stroke="#142131" stroke-width="2"/>
    <text x="970" y="408" text-anchor="middle" font-size="22" fill="#283541">실행 구간</text>
    <line x1="660" y1="360" x2="660" y2="660" stroke="#283541" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="660" y="348" text-anchor="middle" font-size="22" fill="#283541" font-weight="700">스냅샷 B</text>
  </g>

  <g id="row-versions">
    <rect x="80" y="560" width="200" height="80" rx="14" fill="#FFFFFF" stroke="#7A8791" stroke-width="2"/>
    <text x="180" y="610" text-anchor="middle" font-size="28" font-weight="700" fill="#142131">행 버전</text>

    <g id="v1">
      <rect x="240" y="560" width="180" height="80" rx="10" fill="#F4F8FA" stroke="#7A8791" stroke-width="2"/>
      <text x="330" y="610" text-anchor="middle" font-size="26" fill="#142131">버전 1</text>
    </g>
    <g id="v2">
      <rect x="560" y="560" width="180" height="80" rx="10" fill="#F4F8FA" stroke="#7A8791" stroke-width="2"/>
      <text x="650" y="610" text-anchor="middle" font-size="26" fill="#142131">버전 2</text>
    </g>
    <g id="v3">
      <rect x="880" y="560" width="180" height="80" rx="10" fill="#F4F8FA" stroke="#7A8791" stroke-width="2"/>
      <text x="970" y="610" text-anchor="middle" font-size="26" fill="#142131">버전 3</text>
    </g>
  </g>

  <g id="commits">
    <g>
      <circle cx="540" cy="660" r="12" fill="#0F8790"/>
      <text x="540" y="704" text-anchor="middle" font-size="22" fill="#0F8790" font-weight="700">커밋</text>
    </g>
    <g>
      <circle cx="860" cy="660" r="12" fill="#0F8790"/>
      <text x="860" y="704" text-anchor="middle" font-size="22" fill="#0F8790" font-weight="700">커밋</text>
    </g>
  </g>

  <g id="visibility">
    <path d="M320 200 C 320 350, 330 560, 330 560" fill="none" stroke="#0F8790" stroke-width="2.5" marker-end="url(#arrow-acc)"/>
    <text x="350" y="420" font-size="22" fill="#0F8790">A는 버전 1 관측</text>

    <path d="M660 400 C 660 480, 650 560, 650 560" fill="none" stroke="#283541" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="670" y="510" font-size="22" fill="#283541">B는 버전 2 관측</text>
  </g>

  <g id="vacuum">
    <rect x="1140" y="540" width="280" height="120" rx="14" fill="#FFFFFF" stroke="#D39A2C" stroke-width="2.5" stroke-dasharray="10 6"/>
    <text x="1280" y="588" text-anchor="middle" font-size="28" font-weight="700" fill="#D39A2C">정리</text>
    <text x="1280" y="626" text-anchor="middle" font-size="22" fill="#7A8791">더 이상 안 보이는 옛 버전 제거</text>
    <path d="M420 600 C 700 600, 950 600, 1140 600" fill="none" stroke="#D39A2C" stroke-width="2.5" stroke-dasharray="10 6" marker-end="url(#arrow-amb)"/>
    <text x="700" y="690" text-anchor="middle" font-size="22" fill="#D39A2C">아무 트랜잭션도 안 보면 버전 1 폐기</text>
  </g>
</svg>
