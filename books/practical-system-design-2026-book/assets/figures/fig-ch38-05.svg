<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Noto Sans KR','NanumSquare',sans-serif">
  <title>삭제 요청 전파와 완료 증거</title>
  <desc>탈퇴 요청이 원문 · index · cache · conversation · evaluation · backup에 전파되고, 각 삭제가 완료되면 증거로 남는 흐름을 보여준다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#283541"/></marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0F8790"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <g id="caption" font-size="24" fill="#7A8791">
    <text x="70" y="60">탈퇴 요청이 원문·index·cache·conversation·evaluation·backup에 전파되고 완료 증거가 남는 흐름</text>
  </g>

  <g id="legend" font-size="22" fill="#283541">
    <rect x="1230" y="35" width="315" height="44" rx="8" fill="#F4F8FA" stroke="#D8E1E2" stroke-width="2"/>
    <line x1="1250" y1="57" x2="1310" y2="57" stroke="#283541" stroke-width="2.5"/>
    <text x="1320" y="65">삭제 전파</text>
    <line x1="1450" y1="57" x2="1490" y2="57" stroke="#0F8790" stroke-width="2.5" stroke-dasharray="10 8"/>
    <text x="1500" y="65">완료</text>
  </g>

  <g id="request">
    <rect x="80" y="420" width="240" height="120" rx="14" fill="#EFF5F4" stroke="#0F8790" stroke-width="2.5"/>
    <text x="200" y="490" text-anchor="middle" font-size="30" fill="#142131">삭제 요청</text>
  </g>

  <g id="evidence">
    <rect x="1240" y="420" width="260" height="120" rx="14" fill="#EFF5F4" stroke="#0F8790" stroke-width="2.5"/>
    <rect x="1248" y="428" width="244" height="104" rx="10" fill="none" stroke="#0F8790" stroke-width="1.5"/>
    <text x="1370" y="490" text-anchor="middle" font-size="30" fill="#142131">완료 증거</text>
  </g>

  <g id="targets">
    <g id="source">
      <rect x="630" y="105" width="240" height="90" rx="12" fill="#F4F8FA" stroke="#142131" stroke-width="2.5"/>
      <text x="750" y="160" text-anchor="middle" font-size="28" fill="#142131">원문</text>
    </g>
    <g id="index">
      <rect x="630" y="235" width="240" height="90" rx="12" fill="#F4F8FA" stroke="#142131" stroke-width="2.5"/>
      <text x="750" y="290" text-anchor="middle" font-size="28" fill="#142131">Index</text>
    </g>
    <g id="cache">
      <rect x="630" y="365" width="240" height="90" rx="12" fill="#F4F8FA" stroke="#142131" stroke-width="2.5"/>
      <text x="750" y="420" text-anchor="middle" font-size="28" fill="#142131">Cache</text>
    </g>
    <g id="conversation">
      <rect x="630" y="495" width="240" height="90" rx="12" fill="#F4F8FA" stroke="#142131" stroke-width="2.5"/>
      <text x="750" y="550" text-anchor="middle" font-size="28" fill="#142131">Conversation</text>
    </g>
    <g id="evaluation">
      <rect x="630" y="625" width="240" height="90" rx="12" fill="#F4F8FA" stroke="#142131" stroke-width="2.5"/>
      <text x="750" y="680" text-anchor="middle" font-size="28" fill="#142131">Evaluation</text>
    </g>
    <g id="backup">
      <rect x="630" y="755" width="240" height="90" rx="12" fill="#F4F8FA" stroke="#142131" stroke-width="2.5"/>
      <text x="750" y="810" text-anchor="middle" font-size="28" fill="#142131">Backup</text>
    </g>
  </g>

  <g id="edges-propagate" stroke="#283541" stroke-width="2.5" fill="none">
    <path d="M320 450 C 470 450, 480 150, 630 150" marker-end="url(#arrow)"/>
    <path d="M320 450 C 470 450, 480 280, 630 280" marker-end="url(#arrow)"/>
    <path d="M320 450 C 470 450, 480 410, 630 410" marker-end="url(#arrow)"/>
    <path d="M320 450 C 470 450, 480 540, 630 540" marker-end="url(#arrow)"/>
    <path d="M320 450 C 470 450, 480 670, 630 670" marker-end="url(#arrow)"/>
    <path d="M320 450 C 470 450, 480 800, 630 800" marker-end="url(#arrow)"/>
  </g>
  <g id="edge-propagate-labels" font-size="22" fill="#283541">
    <text x="430" y="440" text-anchor="middle">전파</text>
  </g>

  <g id="edges-complete" stroke="#0F8790" stroke-width="2.5" stroke-dasharray="10 8" fill="none">
    <path d="M870 150 C 1050 150, 1080 450, 1240 450" marker-end="url(#arrow-accent)"/>
    <path d="M870 280 C 1050 280, 1080 450, 1240 450" marker-end="url(#arrow-accent)"/>
    <path d="M870 410 L1240 450" marker-end="url(#arrow-accent)"/>
    <path d="M870 540 C 1050 540, 1080 470, 1240 470" marker-end="url(#arrow-accent)"/>
    <path d="M870 670 C 1050 670, 1080 490, 1240 490" marker-end="url(#arrow-accent)"/>
    <path d="M870 800 C 1050 800, 1080 500, 1240 500" marker-end="url(#arrow-accent)"/>
  </g>
  <g id="edge-complete-labels" font-size="22" fill="#0F8790">
    <text x="1070" y="440" text-anchor="middle">완료 보고</text>
  </g>
</svg>
