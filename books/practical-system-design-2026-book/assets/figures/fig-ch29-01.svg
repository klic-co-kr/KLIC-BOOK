<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Noto Sans KR','NanumSquare',sans-serif">
  <title>재해 복구 전략 비교</title>
  <desc>Pilot Light, Warm Standby, Active/Active 세 재해 복구 전략을 RTO, RPO, 비용, 복잡도의 상대적 크기로 비교한다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#283541"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <g id="heading">
    <text x="70" y="62" font-size="34" font-weight="700" fill="#142131">재해 복구 전략 비교</text>
    <text x="70" y="98" font-size="24" fill="#7A8791">상대적 크기로만 비교 (구체적 수치 아님)</text>
  </g>

  <g id="legend" font-size="22" fill="#283541">
    <text x="1050" y="98">● ○ ○ = 작음 · ● ● ○ = 보통 · ● ● ● = 큼</text>
  </g>

  <g id="card-pilot">
    <rect x="70" y="180" width="440" height="560" rx="16" fill="#FFFFFF" stroke="#142131" stroke-width="2.5"/>
    <rect x="70" y="180" width="440" height="70" rx="16" fill="#EFF5F4" stroke="#0F8790" stroke-width="2.5"/>
    <text x="290" y="227" text-anchor="middle" font-size="32" font-weight="700" fill="#142131">Pilot Light</text>
    <g font-size="26" fill="#142131">
      <text x="110" y="320">비용</text>
      <text x="110" y="430">RTO</text>
      <text x="110" y="540">RPO</text>
      <text x="110" y="650">복잡도</text>
    </g>
    <g id="pilot-dots" fill="#0F8790">
      <circle cx="330" cy="311" r="11"/><circle cx="370" cy="311" r="11" fill="#FFFFFF" stroke="#7A8791" stroke-width="2"/><circle cx="410" cy="311" r="11" fill="#FFFFFF" stroke="#7A8791" stroke-width="2"/>
      <circle cx="330" cy="421" r="11"/><circle cx="370" cy="421" r="11"/><circle cx="410" cy="421" r="11" fill="#FFFFFF" stroke="#7A8791" stroke-width="2"/>
      <circle cx="330" cy="531" r="11"/><circle cx="370" cy="531" r="11" fill="#FFFFFF" stroke="#7A8791" stroke-width="2"/><circle cx="410" cy="531" r="11" fill="#FFFFFF" stroke="#7A8791" stroke-width="2"/>
      <circle cx="330" cy="641" r="11"/><circle cx="370" cy="641" r="11" fill="#FFFFFF" stroke="#7A8791" stroke-width="2"/><circle cx="410" cy="641" r="11" fill="#FFFFFF" stroke="#7A8791" stroke-width="2"/>
    </g>
    <g font-size="24" fill="#283541" text-anchor="end">
      <text x="490" y="320">낮음</text>
      <text x="490" y="430">큼(느림)</text>
      <text x="490" y="540">보통</text>
      <text x="490" y="650">낮음</text>
    </g>
  </g>

  <g id="card-warm">
    <rect x="580" y="180" width="440" height="560" rx="16" fill="#FFFFFF" stroke="#142131" stroke-width="2.5"/>
    <rect x="580" y="180" width="440" height="70" rx="16" fill="#EFF5F4" stroke="#0F8790" stroke-width="2.5"/>
    <text x="800" y="227" text-anchor="middle" font-size="32" font-weight="700" fill="#142131">Warm Standby</text>
    <g font-size="26" fill="#142131">
      <text x="620" y="320">비용</text>
      <text x="620" y="430">RTO</text>
      <text x="620" y="540">RPO</text>
      <text x="620" y="650">복잡도</text>
    </g>
    <g id="warm-dots" fill="#0F8790">
      <circle cx="840" cy="311" r="11"/><circle cx="880" cy="311" r="11"/><circle cx="920" cy="311" r="11" fill="#FFFFFF" stroke="#7A8791" stroke-width="2"/>
      <circle cx="840" cy="421" r="11"/><circle cx="880" cy="421" r="11"/><circle cx="920" cy="421" r="11" fill="#FFFFFF" stroke="#7A8791" stroke-width="2"/>
      <circle cx="840" cy="531" r="11"/><circle cx="880" cy="531" r="11" fill="#FFFFFF" stroke="#7A8791" stroke-width="2"/><circle cx="920" cy="531" r="11" fill="#FFFFFF" stroke="#7A8791" stroke-width="2"/>
      <circle cx="840" cy="641" r="11"/><circle cx="880" cy="641" r="11"/><circle cx="920" cy="641" r="11" fill="#FFFFFF" stroke="#7A8791" stroke-width="2"/>
    </g>
    <g font-size="24" fill="#283541" text-anchor="end">
      <text x="1000" y="320">보통</text>
      <text x="1000" y="430">보통</text>
      <text x="1000" y="540">작음</text>
      <text x="1000" y="650">보통</text>
    </g>
  </g>

  <g id="card-active">
    <rect x="1090" y="180" width="440" height="560" rx="16" fill="#FFFFFF" stroke="#D39A2C" stroke-width="3"/>
    <rect x="1090" y="180" width="440" height="70" rx="16" fill="#EFF5F4" stroke="#0F8790" stroke-width="2.5"/>
    <text x="1310" y="227" text-anchor="middle" font-size="32" font-weight="700" fill="#142131">Active/Active</text>
    <g font-size="26" fill="#142131">
      <text x="1130" y="320">비용</text>
      <text x="1130" y="430">RTO</text>
      <text x="1130" y="540">RPO</text>
      <text x="1130" y="650">복잡도</text>
    </g>
    <g id="active-dots" fill="#0F8790">
      <circle cx="1350" cy="311" r="11"/><circle cx="1390" cy="311" r="11"/><circle cx="1430" cy="311" r="11"/>
      <circle cx="1350" cy="421" r="11"/><circle cx="1390" cy="421" r="11" fill="#FFFFFF" stroke="#7A8791" stroke-width="2"/><circle cx="1430" cy="421" r="11" fill="#FFFFFF" stroke="#7A8791" stroke-width="2"/>
      <circle cx="1350" cy="531" r="11"/><circle cx="1390" cy="531" r="11" fill="#FFFFFF" stroke="#7A8791" stroke-width="2"/><circle cx="1430" cy="531" r="11" fill="#FFFFFF" stroke="#7A8791" stroke-width="2"/>
      <circle cx="1350" cy="641" r="11"/><circle cx="1390" cy="641" r="11"/><circle cx="1430" cy="641" r="11"/>
    </g>
    <g font-size="24" fill="#283541" text-anchor="end">
      <text x="1510" y="320">높음</text>
      <text x="1510" y="430">작음(빠름)</text>
      <text x="1510" y="540">거의 없음</text>
      <text x="1510" y="650">높음</text>
    </g>
  </g>

  <text x="70" y="800" font-size="22" fill="#7A8791">왼쪽으로 갈수록 비용·복잡도는 낮고 복구 시간·손실은 커지며, 오른쪽으로 갈수록 비용·복잡도는 높고 복구 시간·손실은 작아진다.</text>
</svg>
