<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Noto Sans KR','NanumSquare',sans-serif">
  <title>채팅 메시지 기본 경로</title>
  <desc>client·gateway·message service·conversation store·event log·fan-out·sync 경로를 보여준다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#283541"/></marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0F8790"/></marker>
    <marker id="arrow-amb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D39A2C"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <g id="header">
    <text x="80" y="78" font-size="30" font-weight="700" fill="#142131">채팅 메시지 기본 경로</text>
    <text x="80" y="114" font-size="24" fill="#7A8791">client → gateway → service → store·log → fan-out·sync</text>
  </g>

  <g id="legend" font-size="22" fill="#283541">
    <line x1="1010" y1="92" x2="1090" y2="92" stroke="#283541" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="1102" y="100">전송 경로</text>
    <line x1="1230" y1="92" x2="1310" y2="92" stroke="#0F8790" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
    <text x="1322" y="100">commit·응답</text>
    <line x1="1430" y1="92" x2="1510" y2="92" stroke="#D39A2C" stroke-width="2.5" stroke-dasharray="10 6" marker-end="url(#arrow-amb)"/>
    <text x="1522" y="100">비동기 fan-out</text>
  </g>

  <g id="nodes">
    <g id="client">
      <rect x="60" y="380" width="200" height="140" rx="16" fill="#F4F8FA" stroke="#0F8790" stroke-width="2.5"/>
      <text x="160" y="440" text-anchor="middle" font-size="28" font-weight="600" fill="#142131">Client</text>
      <text x="160" y="478" text-anchor="middle" font-size="22" fill="#7A8791">device·session</text>
    </g>

    <g id="gateway">
      <rect x="340" y="380" width="260" height="140" rx="16" fill="#FFFFFF" stroke="#142131" stroke-width="2.5"/>
      <text x="470" y="440" text-anchor="middle" font-size="28" font-weight="600" fill="#142131">Realtime Gateway</text>
      <text x="470" y="478" text-anchor="middle" font-size="22" fill="#7A8791">연결·heartbeat·인증</text>
    </g>

    <g id="msg-service">
      <rect x="680" y="380" width="280" height="140" rx="16" fill="#FFFFFF" stroke="#142131" stroke-width="2.5"/>
      <text x="820" y="440" text-anchor="middle" font-size="28" font-weight="600" fill="#142131">Message Service</text>
      <text x="820" y="478" text-anchor="middle" font-size="22" fill="#7A8791">권한·sequence 할당</text>
    </g>

    <g id="conv-store">
      <rect x="1040" y="200" width="280" height="140" rx="16" fill="#EFF5F4" stroke="#0F8790" stroke-width="2.5"/>
      <text x="1180" y="260" text-anchor="middle" font-size="28" font-weight="600" fill="#142131">Conversation Store</text>
      <text x="1180" y="298" text-anchor="middle" font-size="22" fill="#7A8791">대화 순서 원장</text>
    </g>

    <g id="event-log">
      <rect x="1040" y="560" width="280" height="140" rx="16" fill="#FFFFFF" stroke="#D39A2C" stroke-width="2.5"/>
      <text x="1180" y="620" text-anchor="middle" font-size="28" font-weight="600" fill="#142131">Event Log</text>
      <text x="1180" y="658" text-anchor="middle" font-size="22" fill="#7A8791">persisted message</text>
    </g>

    <g id="fanout">
      <rect x="1380" y="380" width="180" height="140" rx="16" fill="#F4F8FA" stroke="#0F8790" stroke-width="2.5"/>
      <text x="1470" y="440" text-anchor="middle" font-size="28" font-weight="600" fill="#142131">Fan-out</text>
      <text x="1470" y="478" text-anchor="middle" font-size="22" fill="#7A8791">수신 장치 배포</text>
    </g>

    <g id="sync-api">
      <rect x="1380" y="640" width="180" height="120" rx="14" fill="#FFFFFF" stroke="#142131" stroke-width="2.5"/>
      <text x="1470" y="690" text-anchor="middle" font-size="26" font-weight="600" fill="#142131">Sync API</text>
      <text x="1470" y="724" text-anchor="middle" font-size="22" fill="#7A8791">cursor 동기화</text>
    </g>
  </g>

  <g id="edges" fill="none">
    <path d="M260 450 L340 450" stroke="#283541" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="270" y="438" font-size="22" fill="#283541">전송</text>

    <path d="M600 450 L680 450" stroke="#283541" stroke-width="2.5" marker-end="url(#arrow)"/>

    <path d="M960 420 L1040 420 L1040 270" stroke="#0F8790" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
    <text x="970" y="408" font-size="22" fill="#0F8790">commit</text>

    <path d="M1040 330 L980 330 L980 380" stroke="#0F8790" stroke-width="2.5" marker-end="url(#arrow-accent)" stroke-dasharray="6 6"/>
    <text x="990" y="360" font-size="22" fill="#0F8790">원장 ID·seq</text>

    <path d="M820 520 L820 600 L1040 600 L1180 600 L1180 560" stroke="#D39A2C" stroke-width="2.5" stroke-dasharray="10 6" marker-end="url(#arrow-amb)"/>
    <text x="830" y="588" font-size="22" fill="#D39A2C">event 발행</text>

    <path d="M1320 600 L1470 600 L1470 520" stroke="#D39A2C" stroke-width="2.5" stroke-dasharray="10 6" marker-end="url(#arrow-amb)"/>
    <text x="1340" y="588" font-size="22" fill="#D39A2C">분기</text>

    <path d="M1380 700 L1320 700 L1320 700" stroke="#283541" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M1180 700 L1180 700" stroke="#283541" stroke-width="2.5"/>
    <path d="M1180 700 L1040 700 L1040 700" stroke="#0F8790" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
    <text x="1100" y="690" font-size="22" fill="#0F8790">cursor 기반 누락 메시지</text>

    <path d="M820 380 L820 300 L600 300 L600 380" stroke="#0F8790" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arrow-accent)"/>
    <text x="710" y="288" text-anchor="middle" font-size="22" fill="#0F8790">ACK 전달</text>

    <path d="M1380 450 L1320 450" stroke="#0F8790" stroke-width="2.5" marker-end="url(#arrow-accent)" stroke-dasharray="6 6"/>
  </g>

  <g id="step-tag">
    <rect x="60" y="810" width="300" height="50" rx="10" fill="#EFF5F4" stroke="#0F8790" stroke-width="2"/>
    <text x="210" y="843" text-anchor="middle" font-size="22" font-weight="600" fill="#0F8790">STEP 1 · 실시간 메시지 기본 경로</text>
  </g>
</svg>
