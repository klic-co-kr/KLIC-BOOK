<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Noto Sans KR','NanumSquare',sans-serif">
  <title>Deadline 예산 전달 흐름</title>
  <desc>클라이언트의 전체 deadline이 Gateway, Service, DB 호출 단계로 갈수록 줄어드는 남은 예산으로 전달되고, 예산이 소진되면 요청이 취소되는 흐름을 보여준다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#283541"/></marker>
    <marker id="arrow-amb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D39A2C"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <g id="heading">
    <text x="70" y="62" font-size="34" font-weight="700" fill="#142131">Deadline 예산 전달 흐름</text>
    <text x="70" y="98" font-size="24" fill="#7A8791">전체 deadline이 각 호출의 남은 예산으로 줄어든다</text>
  </g>

  <g id="legend" font-size="22" fill="#283541">
    <line x1="1110" y1="90" x2="1180" y2="90" stroke="#283541" stroke-width="2.5"/>
    <text x="1190" y="98">정상 호출</text>
    <line x1="1330" y1="90" x2="1400" y2="90" stroke="#D39A2C" stroke-width="2.5" stroke-dasharray="10 8"/>
    <text x="1410" y="98">취소(예산 소진)</text>
  </g>

  <g id="budget-chart">
    <text x="60" y="210" font-size="24" fill="#142131" font-weight="600" transform="rotate(-90 60 250)">남은 Deadline</text>
    <line x1="150" y1="320" x2="1450" y2="320" stroke="#142131" stroke-width="2.5"/>
    <g id="bars">
      <rect x="152" y="190" width="56" height="130" rx="6" fill="#0F8790" stroke="#142131" stroke-width="2"/>
      <rect x="462" y="222" width="56" height="98" rx="6" fill="#0F8790" stroke="#142131" stroke-width="2"/>
      <rect x="772" y="254" width="56" height="66" rx="6" fill="#0F8790" stroke="#142131" stroke-width="2"/>
      <rect x="1082" y="286" width="56" height="34" rx="6" fill="#0F8790" stroke="#142131" stroke-width="2"/>
      <rect x="1392" y="310" width="56" height="10" rx="6" fill="#D39A2C" stroke="#142131" stroke-width="2"/>
    </g>
    <polyline points="180,190 490,222 800,254 1110,286 1420,310" fill="none" stroke="#7A8791" stroke-width="2" stroke-dasharray="6 6"/>
    <g id="bar-labels" font-size="22" fill="#283541" text-anchor="middle">
      <text x="180" y="178">전체 예산</text>
      <text x="490" y="210">감소</text>
      <text x="800" y="242">감소</text>
      <text x="1110" y="274">부족</text>
      <text x="1420" y="298" fill="#D39A2C">소진</text>
    </g>
    <g id="guides" stroke="#D8E1E2" stroke-width="1.5" stroke-dasharray="4 5">
      <line x1="180" y1="320" x2="180" y2="470"/>
      <line x1="490" y1="320" x2="490" y2="470"/>
      <line x1="800" y1="320" x2="800" y2="470"/>
      <line x1="1110" y1="320" x2="1110" y2="470"/>
      <line x1="1420" y1="320" x2="1420" y2="470"/>
    </g>
  </g>

  <g id="nodes">
    <g id="client"><rect x="70" y="470" width="220" height="130" rx="14" fill="#F4F8FA" stroke="#0F8790" stroke-width="2.5"/><text x="180" y="544" text-anchor="middle" font-size="30" fill="#142131">클라이언트</text></g>
    <g id="gateway"><rect x="380" y="470" width="220" height="130" rx="14" fill="#FFFFFF" stroke="#142131" stroke-width="2.5"/><text x="490" y="544" text-anchor="middle" font-size="30" fill="#142131">Gateway</text></g>
    <g id="svcA"><rect x="690" y="470" width="220" height="130" rx="14" fill="#FFFFFF" stroke="#142131" stroke-width="2.5"/><text x="800" y="544" text-anchor="middle" font-size="30" fill="#142131">Service A</text></g>
    <g id="svcB"><rect x="1000" y="470" width="220" height="130" rx="14" fill="#FFFFFF" stroke="#142131" stroke-width="2.5"/><text x="1110" y="544" text-anchor="middle" font-size="30" fill="#142131">Service B</text></g>
    <g id="db"><rect x="1310" y="470" width="220" height="130" rx="14" fill="#F4F8FA" stroke="#0F8790" stroke-width="2.5"/><text x="1420" y="544" text-anchor="middle" font-size="30" fill="#142131">DB</text></g>
  </g>

  <g id="edges">
    <path d="M290 535 L380 535" stroke="#283541" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <path d="M600 535 L690 535" stroke="#283541" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <path d="M910 535 L1000 535" stroke="#283541" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <path d="M1220 535 L1310 535" stroke="#283541" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <g font-size="22" fill="#283541" text-anchor="middle">
      <text x="335" y="524">예산 전달</text>
      <text x="645" y="524">예산 전달</text>
      <text x="955" y="524">예산 전달</text>
      <text x="1265" y="524">예산 전달</text>
    </g>
    <path d="M1420 600 L1420 720 L180 720 L180 600" stroke="#D39A2C" stroke-width="2.5" stroke-dasharray="10 8" fill="none" marker-end="url(#arrow-amb)"/>
    <text x="800" y="708" text-anchor="middle" font-size="26" fill="#D39A2C" font-weight="700">취소 — 예산 소진 시 즉시 중단</text>
  </g>

  <text x="70" y="800" font-size="22" fill="#7A8791">호출마다 남은 deadline을 다음 단계로 전달하고, 남은 예산이 없으면 더 깊은 호출을 시작하지 않고 취소한다.</text>
</svg>
