<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Noto Sans KR','NanumSquare',sans-serif">
  <title>부하 증가와 자원 한계</title>
  <desc>트래픽 부하가 커질 때 CPU·메모리·IOPS·연결 수·네트워크 자원이 안전 여유 한계에 다다르는 모습을 보여준다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#283541"/></marker>
    <marker id="arrow-amb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D39A2C"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <g id="legend" font-size="22" fill="#283541">
    <rect x="1080" y="60" width="26" height="18" fill="#0F8790" stroke="#142131" stroke-width="2"/>
    <text x="1116" y="76">현재 사용률</text>
    <line x1="1240" y1="69" x2="1320" y2="69" stroke="#D39A2C" stroke-width="2.5" stroke-dasharray="10 8"/>
    <text x="1332" y="76">안전 여유 한계</text>
  </g>

  <g id="load">
    <rect x="60" y="360" width="240" height="200" rx="16" fill="#F4F8FA" stroke="#142131" stroke-width="2.5"/>
    <text x="180" y="410" text-anchor="middle" font-size="34" fill="#142131">부하</text>
    <path d="M180 540 L180 455" stroke="#0F8790" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <text x="180" y="555" text-anchor="middle" font-size="24" fill="#0F8790">증가</text>
  </g>

  <g id="edges">
    <path d="M300 460 L380 460" stroke="#283541" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <text x="340" y="448" text-anchor="middle" font-size="22" fill="#283541">부하 전가</text>
  </g>

  <g id="gauges">
    <g id="baseline">
      <line x1="390" y1="680" x2="1480" y2="680" stroke="#142131" stroke-width="2.5"/>
      <line x1="390" y1="386" x2="1480" y2="386" stroke="#D39A2C" stroke-width="2.5" stroke-dasharray="12 8"/>
      <text x="1488" y="392" font-size="22" fill="#D39A2C">안전 여유</text>
    </g>

    <g id="g-cpu">
      <rect x="400" y="260" width="180" height="420" rx="8" fill="#FFFFFF" stroke="#142131" stroke-width="2.5"/>
      <rect x="400" y="294" width="180" height="386" rx="6" fill="#D39A2C"/>
      <text x="490" y="730" text-anchor="middle" font-size="30" fill="#142131">CPU</text>
      <text x="490" y="282" text-anchor="middle" font-size="22" fill="#D39A2C" font-weight="600">한계 도달</text>
      <path d="M490 286 L490 294" stroke="#D39A2C" stroke-width="2.5" fill="none" marker-end="url(#arrow-amb)"/>
    </g>

    <g id="g-mem">
      <rect x="620" y="260" width="180" height="420" rx="8" fill="#FFFFFF" stroke="#142131" stroke-width="2.5"/>
      <rect x="620" y="407" width="180" height="273" rx="6" fill="#0F8790"/>
      <text x="710" y="730" text-anchor="middle" font-size="30" fill="#142131">메모리</text>
    </g>

    <g id="g-iops">
      <rect x="840" y="260" width="180" height="420" rx="8" fill="#FFFFFF" stroke="#142131" stroke-width="2.5"/>
      <rect x="840" y="449" width="180" height="231" rx="6" fill="#0F8790"/>
      <text x="930" y="730" text-anchor="middle" font-size="30" fill="#142131">IOPS</text>
    </g>

    <g id="g-conn">
      <rect x="1060" y="260" width="180" height="420" rx="8" fill="#FFFFFF" stroke="#142131" stroke-width="2.5"/>
      <rect x="1060" y="386" width="180" height="294" rx="6" fill="#0F8790"/>
      <text x="1150" y="730" text-anchor="middle" font-size="30" fill="#142131">연결 수</text>
    </g>

    <g id="g-net">
      <rect x="1280" y="260" width="180" height="420" rx="8" fill="#FFFFFF" stroke="#142131" stroke-width="2.5"/>
      <rect x="1280" y="478" width="180" height="202" rx="6" fill="#0F8790"/>
      <text x="1370" y="730" text-anchor="middle" font-size="30" fill="#142131">네트워크</text>
    </g>
  </g>

  <text x="800" y="810" text-anchor="middle" font-size="24" fill="#7A8791">예시 수치는 개념 도식; 실제 측정값 아님</text>
</svg>
