<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Noto Sans KR','NanumSquare',sans-serif">
  <title>공유 장애 도메인</title>
  <desc>인스턴스는 Zone 안에, Zone은 리전 안에 들어있고, 제어면·KMS·배포 파이프라인은 모든 인스턴스에 걸쳐 공유되는 장애 도메인이다.</desc>
  <defs>
    <marker id="arrow-amb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D39A2C"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <g id="legend" font-size="22" fill="#283541">
    <text x="100" y="58" font-size="28" font-weight="700" fill="#142131">장애 도메인: 격리된 영역과 모두에게 공유되는 영역</text>
    <line x1="1080" y1="80" x2="1160" y2="80" stroke="#142131" stroke-width="2.5"/>
    <text x="1170" y="88">물리적 격리 영역</text>
    <line x1="1340" y1="80" x2="1420" y2="80" stroke="#D39A2C" stroke-width="2.5" stroke-dasharray="10 6"/>
    <text x="1430" y="88">공유 장애 도메인</text>
  </g>

  <g id="region">
    <rect x="70" y="120" width="1040" height="700" rx="22" fill="#FFFFFF" stroke="#142131" stroke-width="3"/>
    <text x="110" y="168" font-size="32" font-weight="700" fill="#142131">리전</text>

    <g id="zone-a">
      <rect x="110" y="200" width="470" height="590" rx="18" fill="#F4F8FA" stroke="#142131" stroke-width="2.5"/>
      <text x="140" y="246" font-size="28" font-weight="700" fill="#142131">Zone A</text>
      <g font-size="26" fill="#142131">
        <rect x="140" y="286" width="410" height="130" rx="12" fill="#FFFFFF" stroke="#7A8791" stroke-width="2"/><text x="345" y="362" text-anchor="middle">인스턴스</text>
        <rect x="140" y="436" width="410" height="130" rx="12" fill="#FFFFFF" stroke="#7A8791" stroke-width="2"/><text x="345" y="512" text-anchor="middle">인스턴스</text>
        <rect x="140" y="586" width="410" height="130" rx="12" fill="#FFFFFF" stroke="#7A8791" stroke-width="2"/><text x="345" y="662" text-anchor="middle">인스턴스</text>
      </g>
    </g>

    <g id="zone-b">
      <rect x="600" y="200" width="470" height="590" rx="18" fill="#F4F8FA" stroke="#142131" stroke-width="2.5"/>
      <text x="630" y="246" font-size="28" font-weight="700" fill="#142131">Zone B</text>
      <g font-size="26" fill="#142131">
        <rect x="630" y="286" width="410" height="130" rx="12" fill="#FFFFFF" stroke="#7A8791" stroke-width="2"/><text x="835" y="362" text-anchor="middle">인스턴스</text>
        <rect x="630" y="436" width="410" height="130" rx="12" fill="#FFFFFF" stroke="#7A8791" stroke-width="2"/><text x="835" y="512" text-anchor="middle">인스턴스</text>
        <rect x="630" y="586" width="410" height="130" rx="12" fill="#FFFFFF" stroke="#7A8791" stroke-width="2"/><text x="835" y="662" text-anchor="middle">인스턴스</text>
      </g>
    </g>
  </g>

  <g id="shared-services" font-size="28" fill="#142131">
    <text x="1230" y="170" text-anchor="middle" font-size="28" font-weight="700">공유 서비스</text>
    <g id="svc-control">
      <rect x="1180" y="210" width="340" height="150" rx="14" fill="#FFFFFF" stroke="#D39A2C" stroke-width="3" stroke-dasharray="10 6"/>
      <text x="1350" y="280" text-anchor="middle" font-weight="700">제어면</text>
      <text x="1350" y="322" text-anchor="middle" font-size="22" fill="#7A8791">API·스케줄·메타데이터</text>
    </g>
    <g id="svc-kms">
      <rect x="1180" y="386" width="340" height="150" rx="14" fill="#FFFFFF" stroke="#D39A2C" stroke-width="3" stroke-dasharray="10 6"/>
      <text x="1350" y="456" text-anchor="middle" font-weight="700">KMS</text>
      <text x="1350" y="498" text-anchor="middle" font-size="22" fill="#7A8791">자격증명·암호 키</text>
    </g>
    <g id="svc-deploy">
      <rect x="1180" y="562" width="340" height="150" rx="14" fill="#FFFFFF" stroke="#D39A2C" stroke-width="3" stroke-dasharray="10 6"/>
      <text x="1350" y="632" text-anchor="middle" font-weight="700">배포 파이프라인</text>
      <text x="1350" y="674" text-anchor="middle" font-size="22" fill="#7A8791">모든 인스턴스로 동일 배포</text>
    </g>
  </g>

  <g id="shared-depend-edges" fill="none" stroke="#D39A2C" stroke-width="2.5" stroke-dasharray="10 6">
    <path d="M1180 285 C 1130 285, 1130 470, 1110 470" marker-end="url(#arrow-amb)"/>
    <path d="M1180 461 C 1130 461, 1130 470, 1110 470" marker-end="url(#arrow-amb)"/>
    <path d="M1180 637 C 1130 637, 1130 470, 1110 470" marker-end="url(#arrow-amb)"/>
  </g>

  <g id="note">
    <text x="800" y="858" text-anchor="middle" font-size="24" fill="#7A8791">Zone·리전은 물리적으로 격리되지만, 공유 서비스가 장애를 일으키면 모든 인스턴스가 함께 쓰러진다</text>
  </g>
</svg>
