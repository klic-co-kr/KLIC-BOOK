book:
  title: GitHub 협업 실무 가이드
  metadata_title: 'GitHub 협업 실무 가이드: AI 코딩 시대, 협업의 기준점'
  subtitle: AI 코딩 시대, 협업의 기준점
  author: KLIC
  language: ko-KR
  short_title: GITHUB COLLABORATION
  output_name: github-guide
  subject: GitHub 협업 실무 가이드
  keywords:
    - GitHub
    - 협업
    - Pull Request
    - AI 코딩
    - 이슈
  edition_label: KLIC · 비상업적 공유용
  copyright_notice: 이 가이드의 저작권은 KLIC에 있다. 비상업적 공유를 허용하며, 전재 시 출처와 저자를 표기한다. 모든 상업적 용도는 사전에 저자의 서면 허락을 받아야 한다.
  build_date: auto

files:
  include:
    - '[0-9][0-9]-*.md'
  order: []
  chapter_file_pattern: '^[0-9]{2}[-_].*\.md$'
  front_matter_file: 00-intro.md

editorial:
  preset: fde-midnight
  cover_theme: burgundy
  include_cover: true
  include_title_page: true
  include_editorial_note: true
  include_generated_toc: true
  include_chapter_openers: true
  toc_depth: 2
  toc_lead: 장과 절을 위에서 아래로 자연스럽게 훑을 수 있도록 1단 목차로 정리했습니다.
  cover_eyebrow: GITHUB COLLABORATION
  cover_watermark: GH
  title_page_quote: AI 코딩 도구를 써도 협업의 기준점은 GitHub다.
  title_page_edition_label: 비상업적 공유용
  front_matter_header: ABOUT THIS GUIDE
  chapter_eyebrow: CHAPTER
  editorial_note_title: 이 책을 펴내며
  editorial_note_paragraphs:
    - 이 가이드는 GitHub 협업 절차를 초보자도 따라올 수 있도록 일상어로 정리했습니다.
    - AI 코딩 도구를 쓸 때 팀 협업의 기준을 GitHub에 두고, issue·branch·PR 흐름을 중심으로 설명합니다.
  build_date_format: korean

style:
  page_size: A4
  body_font: NanumMyeongjo, Noto Serif CJK KR, serif
  heading_font: NanumSquare, Noto Sans CJK KR, sans-serif
  mono_font: NanumGothicCoding, Noto Sans Mono CJK KR, monospace
  body_font_size_pt: 10.0
  body_line_height: 1.72
  colors:
    ink: '#142131'
    text: '#283541'
    muted: '#7A8791'
    line: '#D8E1E2'
    wash: '#EFF5F4'
    paper: '#FFFFFF'
  margins_mm:
    top: 18
    right: 20
    bottom: 17
    left: 20
  extra_css: |
    /* ai-tells: gradient 제거, flat 단일 액센트. 색은 cover_theme 테마 변수를 따른다 */
    .cover::after { background: none !important; }
    .accent-bar { background: var(--cyan) !important; }
    .chapter-opener::after { background: none !important; }
    .chapter-opener .bottom-line { background: var(--cyan) !important; opacity: .45; }
    .chapter-visual::before { background: var(--cyan-dark) !important; }

visuals:
  enabled: true
  default_kicker: VISUAL GUIDE
  default_note: '편집 요약: 본문의 장·절 구조와 핵심 문장을 재배열한 도식이며, 원문을 대체하지 않습니다.'
  chapters:
    '2장 팀 프로젝트의 기본 흐름':
      kicker: WORKFLOW
      title: 한 레포, branch, PR로 흐르는 협업
      thesis: main을 바로 고치지 않고 issue에서 branch, PR, 리뷰를 거쳐 main에 합친다.
      diagram:
        layout: process
        label: GITHUB FLOW
        steps:
          - {title: Issue, text: 할 일을 정의한다}
          - {title: Branch, text: 작업 공간을 분리한다}
          - {title: Commit + Push, text: GitHub에 공유한다}
          - {title: Pull Request, text: 검토를 요청한다}
          - {title: Review + Merge, text: 확인 후 main에 합친다}
      table:
        title: 흐름의 확인점
        headers: [단계, 확인할 것, 산출물]
        rows:
          - [Issue, 범위와 완료 조건, 작업 카드]
          - [Branch, main 최신에서 분리, 작업 공간]
          - [PR, 왜·무엇·확인법, 검토 요청서]

    '5장 할일은 issue로 작게 쪼개기':
      kicker: ISSUE SCOPE
      title: 이번에 딱 무엇을 할지 정하는 장치
      thesis: AI에게 너무 큰 일을 한 번에 던지는 실패를 막기 위해 issue 단위를 작게 잡는다.
      table:
        title: 좋은 issue vs 나쁜 issue
        headers: [기준, 좋은 issue, 나쁜 issue]
        rows:
          - [크기, 한 번에 끝낼 수 있다, 전체 개선처럼 범위가 크다]
          - [완료 조건, 눈에 보인다, 성공 기준이 없다]
          - [범위, 화면·파일·데이터가 분명하다, 어디까지 바꿔도 되는지 불명확하다]
      diagram:
        layout: principles
        label: ONE ISSUE = ONE PR
        cards:
          - {title: issue 1개, text: 할 일의 최소 단위}
          - {title: branch 1개, text: 작업 공간 1개}
          - {title: PR 1개, text: 검토 요청 1개}

    '8장 Pull Request 만들기':
      kicker: PR AS REQUEST
      title: 결과물 자랑이 아니라 검토 요청서
      thesis: 팀원이 빠르게 이해하도록 왜, 무엇을, 어떻게 확인하면 되는지를 쓴다.
      table:
        title: PR 제목의 좋고 나쁨
        headers: [종류, 예시]
        rows:
          - [좋은 제목, 'fix: clarify login error message']
          - [좋은 제목, 'feat: add profile preview card']
          - [나쁜 제목, 'update / final / 여러가지 고침']

    '9장 리뷰 받고 수정하기':
      kicker: REVIEW MAP
      title: PR에서 확인할 네 탭
      thesis: 리뷰는 혼나는 과정이 아니라 main에 들어가기 전 서로 확인하는 과정이다.
      diagram:
        layout: quadrant
        label: PR TABS
        cards:
          - {title: Conversation, text: 제목·본문·댓글·수정 요청}
          - {title: Commits, text: commit 목록과 쪼갬 여부}
          - {title: Checks, text: CI 빌드·테스트 결과}
          - {title: Files changed, text: 줄별 diff와 코멘트}
      table:
        title: 역할별 할 일
        headers: [역할, 확인점]
        rows:
          - [작성자, 작은 PR, 확인 방법, diff 먼저 보기]
          - [리뷰어, issue 범위, 실제 동작, 관련 없는 변경]

    '11장 바이브코더 협업 규칙':
      kicker: TEAM RULES
      title: 사고를 줄이는 세 가지 규칙
      thesis: AI는 속도를 높이지만 변경 범위가 커지고 의도를 놓치기 쉽다. 기본선 규칙이 사고를 줄인다.
      diagram:
        layout: principles
        label: THREE RULE SETS
        cards:
          - {title: 작업 규칙, text: pull · 새 branch · 작은 PR · 계획 먼저}
          - {title: 확인 규칙, text: diff · 직접 실행 · 테스트 안 했으면 안 했다고}
          - {title: 금지 규칙, text: main push · 토큰 노출 · 대량 변경 · reset --hard 혼자 결정}
      table:
        title: 레포 보호 설정
        headers: [설정, 역할]
        rows:
          - [branch protection, main 직접 push 금지, PR·리뷰 의무화]
          - [status checks, CI 통과해야 병합 허용]
          - [CODEOWNERS, 지정 리뷰어 자동 지정]

    '13장 자동화로 검증하기 (GitHub Actions)':
      kicker: CI GATE
      title: 기계가 먼저 검사하는 PR
      thesis: PR이 열리면 기계가 lint·test·build를 돌리고, 통과한 PR만 main에 들어간다.
      diagram:
        layout: process
        label: CI PIPELINE
        steps:
          - {title: PR 열림, text: 트리거가 워크플로 실행}
          - {title: Lint, text: 코드 스타일 검사}
          - {title: Test, text: 단위·통합 테스트}
          - {title: Build, text: 빌드 가능 확인}
          - {title: 게이트, text: 실패 시 병합 차단}
      table:
        title: Actions 핵심 용어
        headers: [용어, 의미]
        rows:
          - [workflow, .github/workflows/*.yml 자동화 단위]
          - [on, 실행 트리거(push·pull_request)]
          - [job·step, 실행 단위와 세부 동작]
          - [runner, 명령을 실행하는 기계]

    '14장 변경 합치기와 충돌 해결':
      kicker: MERGE MODES
      title: 충돌은 에러가 아니라 판단 요청이다
      thesis: 같은 줄을 다르게 고쳤으면 Git이 자동 합치지 못한다. 사람이 어느 쪽을 살릴지 정한다.
      table:
        title: 합치기 방식 비교
        headers: [방식, 동작, 특징]
        rows:
          - [fast-forward, main 포인터를 앞으로 옮김, 병합 커밋 없이 일직선]
          - [3-way merge, 두 부모를 둔 병합 커밋, 합친 흔적이 남음]
          - [rebase, 출발점을 최신 main 위로, 히스토리 정리 (공유 branch 주의)]
      diagram:
        layout: process
        label: CONFLICT RESOLVE
        steps:
          - {title: git status, text: 충돌 파일 찾기}
          - {title: 편집, text: 표식 사이를 한 쪽으로}
          - {title: git add, text: 해결 표시}
          - {title: git commit, text: 합치기 완료}

    '15장 릴리스와 태그 (버전 관리)':
      kicker: RELEASE
      title: 안정 시점에 이름표 붙이기
      thesis: 코드가 계속 바뀌어도 특정 시점의 안정 상태를 tag로 부르고 돌아갈 수 있다.
      diagram:
        layout: ladder
        label: VERSION LADDER
        steps:
          - {title: tag, text: 커밋에 고정 이름표}
          - {title: semantic version, text: v1.2.3 세 자리 규칙}
          - {title: release, text: 태그에 제목과 노트}
      table:
        title: 시맨틱 버전 자리
        headers: [자리, 의미]
        rows:
          - [major(1), 기존 사용법이 깨지는 큰 변경]
          - [minor(2), 호환되는 새 기능 추가]
          - [patch(3), 버그 수정]

quality:
  require_a4: true
  require_embedded_fonts: true
  require_unicode_fonts: true
  require_outline: true
  allow_blank_pages: 0
  paragraph_probe_min_chars: 36
  paragraph_probe_limit: 1200
