book:
  title: "AI 에이전트 깊이 이해하기"
  metadata_title: "AI 에이전트 깊이 이해하기: 설계 원리와 엔지니어링 실천"
  subtitle: "Agent = LLM + 컨텍스트 + 도구 — 10장으로 끝내는 AI 에이전트 설계와 실전"
  author: "원저작 chemark · 한국어 번역 KLIC"
  language: "ko-KR"
  short_title: "DEEP UNDERSTANDING AI AGENT"
  output_name: "ai-agent-book-ko"
  subject: "AI 에이전트 깊이 이해하기 한국어 PDF 편집본"
  keywords:
    - AI 에이전트
    - LLM
    - 컨텍스트 엔지니어링
    - 도구
    - MCP
    - RAG
  edition_label: "한국어 번역판 · Apache 2.0"
  copyright_notice: "이 책은 chemark 의 오픈소스 저서 《深入理解 AI Agent：设计原理与工程实践》(Apache License 2.0)를 한국어로 번역한 판본이다. 원본 라이선스는 licenses/LICENSE-upstream-apache.txt에 보존했으며 원저자를 명시한다. 원저자는 이 번역판을 보증하거나 후원하지 않는다. 번역은 원문의 기술 내용과 구조를 충실히 따랐으며, 본문 133개 이미지는 원본을 그대로 사용한다(일부 도면 라벨은 중국어 원문 그대로일 수 있어 최종판에서 별도 제작을 검토한다)."
  build_date: "auto"

files:
  include:
    - "*.md"
    - "**/*.md"
  exclude:
    - "**/node_modules/**"
    - "**/.git/**"
    - "**/output/**"
    - "**/build/**"
    - "images/**"
  front_matter_file: "00-들어가며.md"
  order: []
  strip_front_matter_sections:
    - "목차"
  front_matter_drop_paragraphs: []
  strip_front_matter_leading_rules: true
  chapter_file_pattern: ".*\\.md$"

editorial:
  preset: "fde-midnight"
  cover_theme: "ink"
  include_cover: true
  include_title_page: true
  include_editorial_note: true
  include_generated_toc: true
  include_chapter_openers: true
  toc_depth: 2
  section_list_depth: 2
  cover_eyebrow: "DEEP UNDERSTANDING AI AGENT"
  cover_watermark: "AI"
  title_page_quote: "auto"
  title_page_edition_label: "한국어 번역판 · 원저자 chemark · Apache 2.0"
  front_matter_header: "ABOUT THIS BOOK"
  chapter_eyebrow: "CHAPTER"
  part_eyebrow: "PART"
  appendix_eyebrow: "APPENDIX"
  afterword_eyebrow: "AFTERWORD"
  editorial_note_title: "PDF 편집본 안내"
  editorial_note_paragraphs:
    - "이 문서는 chemark 의 오픈소스 저서 《深入理解 AI Agent：设计原理与工程实践》(Apache License 2.0)를 한국어로 번역한 원고를 하나의 책으로 편집한 PDF 편집본이다. 원문의 장·절 구조와 본문 내용을 유지했다."
    - "표지, 제목 페이지, 목차, 장 표제지, 머리말·꼬리말, 인용문 스타일은 읽기와 탐색을 돕도록 재구성했다. 원문의 사실 관계와 코드·표·이미지는 원문을 따른다."
    - "원저자 chemark 의 원 라이선스(Apache 2.0)는 licenses/LICENSE-upstream-apache.txt에 보존했다. 원저자는 이 번역판을 보증하거나 후원하지 않는다."
  editorial_note_footer_paragraphs:
    - "번역 품질과 일부 도면의 한국어화는 후속 판에서 다듬는다."
  build_date_format: "iso"
  cover_process_chips:
    - 기초
    - 컨텍스트
    - 기억·지식
    - 도구
    - 코딩 에이전트
    - 평가
    - 후훈련
    - 자기진화
    - 멀티모달
    - 다중 에이전트

visuals:
  enabled: false
  auto_from_headings: false
  chapters: {}

style:
  page_size: "A4"
  body_font: "Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif"
  heading_font: "Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif"
  mono_font: "DejaVu Sans Mono, monospace"
  body_font_size_pt: 9.8
  body_line_height: 1.72
  colors:
    navy: "#081827"
    navy_alt: "#102B38"
    cyan: "#36C7D0"
    cyan_dark: "#0F8790"
    amber: "#D39A2C"
    ink: "#142131"
    text: "#283541"
    muted: "#7A8791"
    line: "#D8E1E2"
    wash: "#EFF5F4"
    paper: "#FFFFFF"
  margins_mm:
    top: 18
    right: 20
    bottom: 17
    left: 20
  extra_css: |

    /* AI 에이전트 깊이 이해하기 — 본문 중심 + 다량 코드·표 보정 */
    .front-matter { font-size: 10.0pt; }
    .front-matter p { margin-bottom: 4.0mm; }
    .front-matter h2 { font-size: 18pt; }
    .kind-frontmatter .fm-eyebrow { color: var(--cyan-dark); font-size: 8pt; letter-spacing: 2pt; margin-bottom: 6mm; }

    .toc h1 { bookmark-level: 1; font-size: 26pt; }
    .toc-item > a { font-size: 9.2pt; }
    .toc-item > a::after { font-family: "Noto Sans KR", sans-serif; font-size: 7.4pt; white-space: nowrap; }
    .toc-sections li { font-size: 7.6pt; }
    .toc-sections a::after { font-family: "Noto Sans KR", sans-serif; font-size: 7.4pt; white-space: nowrap; }

    table { font-size: 8.4pt; line-height: 1.5; }
    table th { font-size: 8.6pt; }
    pre, code { font-size: 8.1pt; line-height: 1.5; }
    pre { white-space: pre-wrap; word-break: break-word; }
    img { max-width: 100%; height: auto; display: block; margin: 5mm auto; break-inside: avoid; }

    .chapter-body h2 { font-size: 15.6pt; }
    .chapter-body h3 { font-size: 12.0pt; }
    .chapter-body h4 { font-size: 10.4pt; }

quality:
  require_a4: true
  require_embedded_fonts: true
  require_unicode_fonts: true
  require_outline: true
  allow_blank_pages: 0
  paragraph_probe_min_chars: 36
  paragraph_probe_limit: 1200
  reference_ngram_words: 8
  reference_ngram_min_chars: 44
