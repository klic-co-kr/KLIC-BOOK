<text x="390" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, 'Noto Sans KR', 'Noto Sans KR', sans-serif" font-size="16" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal">전략：LLM 동결 + 투영 층 학습 → SFT에서 LLM 해동（치명적 망각 방지）</text>
