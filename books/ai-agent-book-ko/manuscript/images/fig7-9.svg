<text x="150" y="202" font-family="Arial, 'Helvetica Neue', Helvetica, 'Noto Sans KR', 'Noto Sans KR', sans-serif" font-size="16" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal">(CLIP ViT)</text>
