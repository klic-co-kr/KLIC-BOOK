<text x="150" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, 'Noto Sans KR', 'Noto Sans KR', sans-serif" font-size="14" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal">（폭포/도시/자연）</text>
<line x1="150" y1="132" x2="150" y2="158" stroke="#333333" stroke-width="2" marker-end="url(#ah)"/>
<rect x="500" y="70" width="220" height="60" rx="4" fill="#f5f5f5" stroke="#333333" stroke-width="2"/>
<text x="610" y="90" font-family="Arial, 'Helvetica Neue', Helvetica, 'Noto Sans KR', 'Noto Sans KR', sans-serif" font-size="16" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal">출력 설명</text>
<text x="610" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, 'Noto Sans KR', 'Noto Sans KR', sans-serif" font-size="14" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal">&quot;거대한 폭포 옆에 무지개가 걸려 있음&quot;</text>
