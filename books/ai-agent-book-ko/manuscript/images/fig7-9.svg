<text x="370" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, 'Noto Sans KR', 'Noto Sans KR', sans-serif" font-size="14" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal">시각→언어 공간 정렬</text>
<text x="370" y="288" font-family="Arial, 'Helvetica Neue', Helvetica, 'Noto Sans KR', 'Noto Sans KR', sans-serif" font-size="14" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal">파라미터 수：~400K</text>
